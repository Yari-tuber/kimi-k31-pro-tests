<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>海上小屋 · Isle of Calm</title>
<style>
  :root{
    --glass: rgba(255,255,255,.52);
    --glass-b: rgba(255,255,255,.75);
    --ink: #3a4a6b;
    --ink-soft: #6a7a99;
    --accent: #ff8f7a;
    --shadow: 0 10px 40px rgba(40,60,110,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#bfe6ff;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  body.night{--glass: rgba(22,30,70,.42);--glass-b: rgba(160,180,255,.28);--ink:#eef2ff;--ink-soft:#aab6e0;--shadow:0 10px 40px rgba(0,0,20,.35)}
  .glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:var(--shadow);transition:background .8s,border-color .8s,color .8s}

  /* brand */
  .brand{position:fixed;left:34px;top:28px;pointer-events:none;color:#fff;
    text-shadow:0 2px 18px rgba(30,60,120,.35),0 1px 2px rgba(30,60,120,.25)}
  .brand h1{font-size:34px;font-weight:600;letter-spacing:10px}
  .brand h1 span{display:inline-block;font-size:13px;letter-spacing:3px;font-weight:400;margin-left:6px;opacity:.85;vertical-align:middle}
  .brand p{margin-top:8px;font-size:13px;letter-spacing:4px;opacity:.9}
  .brand .line{width:46px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));margin-top:12px}

  /* hints */
  .hints{position:fixed;right:26px;top:26px;padding:16px 18px 14px;border-radius:20px;width:186px;color:var(--ink);font-size:12.5px}
  .hints .t{font-size:13px;font-weight:600;letter-spacing:3px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .hints .t i{font-style:normal;opacity:.6;font-size:11px;transition:transform .3s}
  .hints.fold ul{display:none}.hints.fold .t{margin-bottom:0}.hints.fold .t i{transform:rotate(-90deg)}
  .hints ul{list-style:none}
  .hints li{display:flex;align-items:center;gap:9px;padding:5px 0;color:var(--ink-soft)}
  .hints li b{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:2px 7px;border-radius:999px;
    background:rgba(255,255,255,.55);color:var(--ink);font-weight:500;font-size:11.5px}
  body.night .hints li b{background:rgba(255,255,255,.12)}

  /* time bar */
  .timebar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(820px,94vw);border-radius:26px;padding:14px 20px 14px 16px;
    display:flex;align-items:center;gap:18px}
  .clock{display:flex;align-items:center;gap:12px;min-width:132px}
  .orb{width:44px;height:44px;border-radius:50%;position:relative;flex:none;
    background:radial-gradient(circle at 35% 35%,#fff7d6,#ffd36a 55%,#ffb347);box-shadow:0 0 22px rgba(255,190,80,.7);transition:all .8s}
  .orb.moon{background:radial-gradient(circle at 40% 38%,#fffdf4,#e8e6ff 60%,#c9cdf5);box-shadow:0 0 22px rgba(190,200,255,.7)}
  .orb.moon::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;right:-3px;top:-1px;background:rgba(40,52,110,.55);filter:blur(.5px)}
  #clock{font-size:24px;font-weight:600;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1}
  #period{font-size:12px;color:var(--ink-soft);letter-spacing:3px;margin-top:2px}
  .track{flex:1;position:relative;padding-top:2px}
  .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:6px;padding:0 2px;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,#141c46 0%,#253568 17%,#f7a9a0 25.5%,#ffd9b0 28%,#8fd2ff 36%,#6ec3ff 50%,#8fd2ff 64%,#ffc48c 72%,#ff8e5e 75.5%,#2a3a72 83%,#141c46 100%);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.9);
    box-shadow:0 2px 10px rgba(30,50,100,.35),0 0 0 4px rgba(255,255,255,.35)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 2px 10px rgba(30,50,100,.35)}
  .btns{display:flex;gap:8px;align-items:center}
  .btn{height:36px;min-width:36px;padding:0 12px;border-radius:999px;border:1px solid var(--glass-b);background:rgba(255,255,255,.55);
    color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit;transition:all .25s;display:inline-flex;align-items:center;justify-content:center;gap:4px}
  body.night .btn{background:rgba(255,255,255,.1)}
  .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.85)}
  body.night .btn:hover{background:rgba(255,255,255,.22)}
  .btn.on{background:var(--accent);color:#fff;border-color:transparent}
  .jumps{display:flex;gap:6px}
  .jumps .btn{padding:0 11px;font-size:12.5px}
  .sep{width:1px;height:30px;background:var(--glass-b)}

  #tip{position:fixed;pointer-events:none;padding:6px 12px;border-radius:999px;font-size:12.5px;letter-spacing:1px;color:#3a4a6b;
    background:rgba(255,255,255,.88);box-shadow:0 6px 20px rgba(30,50,100,.2);opacity:0;transform:translate(14px,14px) scale(.9);transition:opacity .2s,transform .2s;white-space:nowrap}
  #tip.show{opacity:1;transform:translate(14px,14px) scale(1)}
  #toast{position:fixed;left:50%;bottom:132px;transform:translate(-50%,10px);padding:9px 20px;border-radius:999px;font-size:13.5px;letter-spacing:2px;
    color:#fff;background:rgba(40,55,100,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:all .45s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:linear-gradient(180deg,#7cc4f5 0%,#c9ecff 55%,#ffe2c8 100%);transition:opacity 1.2s ease,visibility 1.2s}
  #loader.hide{opacity:0;visibility:hidden}
  .ld-sun{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffd76e 60%,#ffb24d);
    box-shadow:0 0 50px rgba(255,200,90,.9);animation:bob 2.4s ease-in-out infinite}
  .ld-sea{width:180px;height:10px;margin-top:14px;border-radius:50%;background:radial-gradient(ellipse,#6fc7e8 0%,rgba(111,199,232,0) 70%);animation:breath 2.4s ease-in-out infinite}
  .ld-t{margin-top:22px;color:#fff;font-size:24px;letter-spacing:12px;text-shadow:0 2px 14px rgba(40,90,160,.35)}
  .ld-s{margin-top:10px;color:#fff;opacity:.9;font-size:12.5px;letter-spacing:4px}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes breath{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.8);opacity:.6}}

  @media (max-width:760px){
    .brand{left:18px;top:18px}.brand h1{font-size:24px;letter-spacing:6px}.brand p{font-size:11px;letter-spacing:2px}
    .hints{right:12px;top:12px;width:150px;padding:12px}
    .timebar{flex-wrap:wrap;gap:10px;padding:12px;bottom:12px}
    .track{order:3;flex-basis:100%}.sep{display:none}
    #toast{bottom:176px}
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div class="brand">
  <h1>海上小屋<span>ISLE OF CALM</span></h1>
  <p>一座漂在时光里的小岛</p>
  <div class="line"></div>

<aside class="hints glass" id="hints">

</div>

<!-- 引导：自动选择可用的 three.js CDN -->
<script>
(function(){
  var V = '0.160.0';
  var cdns = [
    'https://cdn.jsdelivr.net/npm/three@' + V,
    'https://unpkg.com/three@' + V,
    'https://registry.npmmirror.com/three/' + V + '/files'
  ];
  var msg = document.getElementById('ldmsg');
  window.__fail = function(t){ msg.textContent = t; msg.style.color = '#ffefe8'; };
  window.addEventListener('error', function(e){ console.error(e.message); });
  function probe(base){
    return new Promise(function(res, rej){
      var ctl = new AbortController();
      var to = setTimeout(function(){ ctl.abort(); rej(); }, 8000);
      fetch(base + '/build/three.module.js', {signal: ctl.signal, mode: 'cors'})
        .then(function(r){ clearTimeout(to); r.ok ? res(base) : rej(); })
        .catch(function(){ clearTimeout(to); rej(); });
    });
  }
  function start(base){
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({imports: {
      'three': base + '/build/three.module.js',
      'three/addons/': base + '/examples/jsm/'
    }});
    document.head.appendChild(im);
    var m = document.createElement('script');
    m.type = 'module';
    m.textContent = document.getElementById('main-src').textContent;
    document.body.appendChild(m);
  }
  Promise.any(cdns.map(probe)).then(start).catch(function(){
    window.__fail('无法加载 three.js，请检查网络后刷新');
  });
})();
</script>

<script type="text/plain" id="main-src">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   基础工具
   ============================================================ */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
let _seed = 20261025;
const rand = () => { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rand();
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;

// 岛屿海岸线（JS 与着色器共用同一公式，保证浪花贴合岸线）
const shoreR = a => 9.6 + 0.7 * Math.sin(3 * a + 0.5) + 0.4 * Math.sin(5 * a + 1.7) + 0.25 * Math.sin(8 * a + 2.9);
const GY = 1.15; // 草地顶部高度

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9efff, 80, 330);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2400);
const CAM_START = new V3(70, 34, 96);
const CAM_END = new V3(19, 10.5, 24);
camera.position.copy(CAM_START);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.minDistance = 11;
controls.maxDistance = 75;
controls.maxPolarAngle = Math.PI * 0.475;
controls.minPolarAngle = 0.15;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.enabled = false;

/* ============================================================
   三渲二材质：分段渐变 + 边缘光 + 描边
   ============================================================ */
const gradTex = (() => {
  const t = new THREE.DataTexture(new Uint8Array([96, 178, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();
const rimU = { uRimColor: { value: new THREE.Color(1, 1, 1) }, uRimPower: { value: 0.35 } };
function patchToon(sh) {
  sh.uniforms.uRimColor = rimU.uRimColor;
  sh.uniforms.uRimPower = rimU.uRimPower;
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform vec3 uRimColor;\nuniform float uRimPower;')
    .replace('#include <opaque_fragment>', `
      {
        vec3 vdir = normalize(vViewPosition);
        float rimF = 1.0 - clamp(dot(normal, vdir), 0.0, 1.0);
        float rimB = smoothstep(0.66, 0.72, rimF);
        outgoingLight += uRimColor * rimB * uRimPower * diffuseColor.rgb;
      }
      #include <opaque_fragment>`);
}
const matCache = new Map();
function toon(color, opts) {
  if (!opts && matCache.has(color)) return matCache.get(color);
  const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradTex }, opts || {}));
  m.onBeforeCompile = patchToon;
  if (!opts) matCache.set(color, m);
  return m;
}

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x2a3a62, side: THREE.BackSide });
const outlineHover = new THREE.MeshBasicMaterial({ color: 0xffd25e, side: THREE.BackSide, fog: false });
function addOutline(mesh, t = 0.035) {
  const s = mesh.scale;
  const k = (Math.abs(s.x) + Math.abs(s.y) + Math.abs(s.z)) / 3 || 1;
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', mesh.geometry.attributes.position.clone());
  if (mesh.geometry.index) g.setIndex(mesh.geometry.index.clone());
  g = mergeVertices(g, 1e-3);
  g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal, th = t / k;
  for (let i = 0; i < p.count; i++) {
    p.setXYZ(i, p.getX(i) + n.getX(i) * th, p.getY(i) + n.getY(i) * th, p.getZ(i) + n.getZ(i) * th);
  }
  const o = new THREE.Mesh(g, outlineMat);
  o.userData.isOutline = true;
  o.raycast = () => {};
  mesh.add(o);
  return o;
}
// 通用网格构建
function mk(geo, mat, parent, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, typeof mat === 'string' ? toon(mat) : mat);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (o.s !== undefined) Array.isArray(o.s) ? m.scale.set(o.s[0], o.s[1], o.s[2]) : m.scale.setScalar(o.s);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.recv !== false;
  parent.add(m);
  if (o.ol !== false) addOutline(m, o.ol || 0.035);
  return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (a, b, h, s = 16) => new THREE.CylinderGeometry(a, b, h, s);
const sph = (r, w = 20, h = 14) => new THREE.SphereGeometry(r, w, h);
function blobGeo(r, detail = 2, amt = 0.08, sd = 1) {
  const g = new THREE.IcosahedronGeometry(r, detail);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const f = 1 + amt * Math.sin(x * 4.1 * sd + y * 2.7) * Math.cos(z * 3.3 * sd + y * 1.9 + sd);
    p.setXYZ(i, x * f, y * f, z * f);
  }
  g.computeVertexNormals();
  return g;
}

const world = new THREE.Group();
scene.add(world);
const interactRoots = [];
function interactive(root, label, action) {
  root.userData.label = label;
  root.userData.action = action;
  interactRoots.push(root);
}

/* ============================================================
   灯光
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xd4ecff, 0xffe7c4, 1.2);
scene.add(hemi);
function makeDirLight(size) {
  const l = new THREE.DirectionalLight(0xffffff, 2.5);
  l.castShadow = true;
  l.shadow.mapSize.set(size, size);
  const c = l.shadow.camera;
  c.left = -17; c.right = 17; c.top = 17; c.bottom = -17; c.near = 1; c.far = 140;
  l.shadow.bias = -0.0004;
  l.shadow.normalBias = 0.03;
  scene.add(l, l.target);
  return l;
}
const sunLight = makeDirLight(2048);
const moonLight = makeDirLight(1024);
moonLight.color.set(0x9fb4ff);

/* ============================================================
   天空
   ============================================================ */
const skyU = {
  uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uGlow: { value: new THREE.Color() },
  uSunCol: { value: new THREE.Color() }, uSunDir: { value: new V3(0, 1, 0) }, uMoonDir: { value: new V3(0, -1, 0) },
  uNight: { value: 0 }, uTime: { value: 0 }, uMoonVis: { value: 1 }
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 64, 32), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false,
  vertexShader: `
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uGlow; uniform vec3 uSunCol;
    uniform vec3 uSunDir; uniform vec3 uMoonDir; uniform float uNight; uniform float uTime; uniform float uMoonVis;
    varying vec3 vDir;
    float h31(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }
    float n3(vec3 p){
      vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(mix(h31(i), h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
                 mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm3(vec3 p){ float v = 0.0, a = 0.5; for(int i=0;i<4;i++){ v += a*n3(p); p = p*2.03 + vec3(1.7,9.2,3.1); a *= 0.5; } return v; }
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      float g = smoothstep(-0.02, 0.85, h);
      vec3 col = mix(uHor, uTop, pow(g, 0.62));
      float sd = dot(d, uSunDir);
      float sdp = max(sd, 0.0);
      float nearH = 1.0 - smoothstep(0.0, 0.45, abs(h - 0.02));
      col += uGlow * (pow(sdp, 6.0) * 0.55 + pow(sdp, 1.6) * 0.38 * nearH);

      // 地平线的手绘感云带
      vec2 xz = d.xz / max(length(d.xz), 1e-4);
      float cn = fbm3(vec3(xz * 3.4, h * 15.0) + vec3(uTime*0.004, 0.0, uTime*0.003));
      float band = smoothstep(0.012, 0.06, h) * (1.0 - smoothstep(0.1, 0.3, h));
      float st = smoothstep(0.55, 0.585, cn) * band;
      float st2 = smoothstep(0.62, 0.655, cn) * band;
      vec3 stCol = mix(uHor, vec3(1.0), 0.32 * (1.0 - uNight*0.75)) + uGlow * 0.7 * pow(sdp, 2.0);
      col = mix(col, stCol, st * 0.55);
      col = mix(col, stCol * 1.06 + uGlow * 0.25, st2 * 0.45);

      // 星空 + 银河
      vec3 sp = d * 160.0; vec3 id = floor(sp); vec3 fr = fract(sp) - 0.5;
      float hs = h31(id); float star = 0.0;
      if (hs > 0.991) {
        vec3 o = vec3(h31(id+11.3), h31(id+27.1), h31(id+41.7)) - 0.5;
        float dd = length(fr - o * 0.6);
        float tw = 0.55 + 0.45 * sin(uTime * (1.5 + hs*40.0) + hs * 300.0);
        star = smoothstep(0.17, 0.0, dd) * tw * (0.6 + (hs-0.991)*60.0);
      }
      float mw = exp(-pow(dot(d, normalize(vec3(0.45, 0.55, -0.7))) * 3.0, 2.0));
      float mwn = fbm3(d * 6.0 + 3.0);
      float vis = smoothstep(0.02, 0.22, h) * uNight;
      col += vec3(0.55, 0.48, 0.95) * mw * smoothstep(0.38, 0.78, mwn) * 0.28 * vis;
      col += vec3(0.85, 0.9, 1.0) * star * vis * 2.3;

      // 太阳：卡通硬边圆盘 + 光晕环
      float disk = smoothstep(0.99895, 0.9992, sd);
      float core = smoothstep(0.9994, 0.9997, sd);
      col = mix(col, uSunCol * 2.4, disk);
      col += uSunCol * core * 1.6;
      col += uGlow * smoothstep(0.0012, 0.0, abs(sd - 0.9968)) * 0.22;
      col += uGlow * smoothstep(0.0018, 0.0, abs(sd - 0.9925)) * 0.12;

      // 月亮：弯月 + 柔光
      float md = dot(d, uMoonDir);
      float mdisk = smoothstep(0.9991, 0.99935, md);
      vec3 m2 = normalize(uMoonDir + vec3(0.017, 0.013, 0.006));
      float cut = smoothstep(0.9991, 0.99935, dot(d, m2));
      float moonA = mdisk * (1.0 - cut * 0.9);
      col += vec3(0.55, 0.65, 1.0) * (pow(max(md, 0.0), 320.0) * 0.4 + pow(max(md, 0.0), 30.0) * 0.08) * uMoonVis;
      col = mix(col, vec3(1.0, 0.96, 0.84) * 2.1, moonA * uMoonVis);

      gl_FragColor = vec4(col, 1.0);
    }`
}));

  uniforms: oceanU, transparent: true,
  vertexShader: `
    uniform float uTime;
    varying vec3 vWorld; varying vec3 vN; varying float vH;
    void wave(vec2 p, vec2 dir, float A, float L, float S, inout float h, inout vec2 gr){
      float k = 6.28318 / L; float ph = dot(dir, p) * k + uTime * S;
      h += A * sin(ph); gr += A * k * cos(ph) * dir;
    }
    void main(){
      vec3 pos = position;
      vec2 p = pos.xz;
      float d = length(p);
      float att = mix(0.28, 1.0, smoothstep(9.0, 24.0, d));
      float h = 0.0; vec2 gr = vec2(0.0);
      wave(p, normalize(vec2(1.0, 0.35)), 0.22, 15.0, 1.05, h, gr);
      wave(p, normalize(vec2(-0.4, 1.0)), 0.13, 9.5, 1.35, h, gr);
      wave(p, normalize(vec2(0.7, -0.8)), 0.08, 5.5, 1.9, h, gr);
      wave(p, normalize(vec2(-0.9, -0.3)), 0.045, 3.1, 2.6, h, gr);
      h *= att; gr *= att;
      pos.y += h;
      vH = h;
      vN = normalize(vec3(-gr.x, 1.0, -gr.y));
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uFoam; uniform vec3 uFog; uniform vec3 uSky;
    uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uSunI;
    uniform vec3 uMoonDir; uniform vec3 uMoonCol; uniform float uMoonI;
    uniform float uNight; uniform float uFogNear; uniform float uFogFar;
    uniform vec4 uRip[6];
    varying vec3 vWorld; varying vec3 vN; varying float vH;
    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float noise(vec2 p){
      vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
    }
    float shoreR(float a){ return 9.6 + 0.7*sin(3.0*a+0.5) + 0.4*sin(5.0*a+1.7) + 0.25*sin(8.0*a+2.9); }
    float det(vec2 p){ return noise(p*1.1 + vec2(uTime*0.35, uTime*0.22)) + 0.5*noise(p*2.3 - vec2(uTime*0.28, -uTime*0.4)); }
    void main(){
      vec2 p = vWorld.xz; float t = uTime;
      float e = 0.12;
      float d0 = det(p), dx = det(p + vec2(e, 0.0)), dz = det(p + vec2(0.0, e));
      vec3 N = normalize(vN + vec3(-(dx - d0) / e, 0.0, -(dz - d0) / e) * 0.24);
      vec3 V = normalize(cameraPosition - vWorld);
      float camD = length(cameraPosition - vWorld);
      float ang = atan(p.y, p.x);
      float sd = length(p) - shoreR(ang);

      // 分层卡通水色
      float wob = noise(p * 0.32 + t * 0.04) - 0.5;
      float s = sd + wob * 2.4;
      vec3 mid = mix(uDeep, uShallow, 0.42);
      vec3 col = uDeep;
      col = mix(col, mid, smoothstep(8.6, 8.1, s));
      col = mix(col, uShallow, smoothstep(4.3, 3.9, s));
      col = mix(col, mix(uShallow, uFoam, 0.28), smoothstep(1.6, 1.3, s));

      float ndl = dot(N, normalize(uSunDir + vec3(0.0, 0.3, 0.0)));
      col *= mix(0.9, 1.06, smoothstep(0.55, 0.62, ndl * 0.5 + 0.5));
      col = mix(col, col * 1.12 + 0.03, smoothstep(0.2, 0.32, vH));

      float fr = pow(1.0 - max(dot(N, V), 0.0), 4.0);
      col = mix(col, uSky, clamp(fr * 0.75, 0.0, 0.72));

      // 浅滩焦散
      float c1 = noise(p * 1.6 + vec2(t * 0.5, t * 0.3));
      float c2 = noise(p * 2.19 - vec2(t * 0.4, -t * 0.25));
      float caus = smoothstep(0.06, 0.0, abs(c1 - c2)) * (1.0 - smoothstep(0.0, 4.5, sd)) * smoothstep(-0.6, 0.2, sd);
      col += caus * 0.14 * (1.0 - uNight * 0.6);

      // 环岛浪花
      float fn = noise(p * 1.5 + t * 0.25) * 0.6 + noise(p * 3.3 - t * 0.35) * 0.4;
      float edge = 1.0 - smoothstep(0.35, 0.55, sd + fn * 0.7 - 0.25 * sin(t * 1.3 + ang * 3.0));
      float rings = sin(sd * 2.4 - t * 1.7 + fn * 2.4);
      float ringM = smoothstep(0.82, 0.9, rings) * (1.0 - smoothstep(0.5, 4.8, sd)) * step(0.38, fn);
      float foam = max(edge, ringM);

      // 点击涟漪
      for (int i = 0; i < 6; i++) {
        vec4 r = uRip[i]; float age = t - r.z;
        if (age < 0.0 || age > 4.0) continue;
        float dd = length(p - r.xy); float life = 1.0 - age / 4.0;
        float R = age * 2.4; float w = 0.16 + age * 0.06;
        float ring = smoothstep(w, 0.0, abs(dd - R)) + 0.65 * smoothstep(w * 0.8, 0.0, abs(dd - R * 0.62)) + 0.4 * smoothstep(w*0.7, 0.0, abs(dd - R * 0.3));
        foam = max(foam, clamp(ring, 0.0, 1.0) * life * step(0.22, fn + 0.18 * life));
      }
      foam = clamp(foam, 0.0, 1.0);

      // 波光粼粼：太阳 / 月亮
      vec3 Rs = reflect(-uSunDir, N);
      float ss = max(dot(Rs, V), 0.0);
      float path = pow(ss, 14.0);
      float tw = noise(p * 5.0 + vec2(t * 2.1, -t * 1.6)) * noise(p * 3.1 - vec2(t * 1.3, t * 1.9));
      float spark = smoothstep(0.44 - path * 0.22, 0.48 - path * 0.22, tw) * smoothstep(0.02, 0.15, path);
      float glint = smoothstep(0.5, 0.56, pow(ss, 260.0)) * step(0.22, tw);
      col += uSunCol * (pow(ss, 50.0) * 0.3 + (spark + glint) * 1.9) * uSunI;
      vec3 Rm = reflect(-uMoonDir, N);
      float ms = max(dot(Rm, V), 0.0);
      float mpath = pow(ms, 16.0);
      float mspark = smoothstep(0.44 - mpath * 0.2, 0.48 - mpath * 0.2, tw) * smoothstep(0.03, 0.18, mpath);

      float alpha = mix(0.58, 0.97, smoothstep(-0.5, 6.0, sd));
      alpha = max(alpha, foam);
      float fogF = smoothstep(uFogNear, uFogFar, camD);
      col = mix(col, uFog, fogF);
      alpha = mix(alpha, 1.0, fogF);
      gl_FragColor = vec4(col, alpha);
    }`

function shapeCylinder(geo, fn) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (Math.hypot(x, z) < 1e-6) continue;
    const s = fn(Math.atan2(z, x), y);
    p.setX(i, x * s); p.setZ(i, z * s);
  }
  geo.computeVertexNormals();
  return geo;
}

function leafGeo(len, wid) {
  const g = new THREE.PlaneGeometry(len, wid, 14, 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x0 = p.getX(i) + len / 2, y0 = p.getY(i), t = x0 / len;
    const wf = Math.sin(Math.PI * (t * 0.86 + 0.07));
    const z = y0 * wf;
    const y = -t * t * len * 0.5 + Math.abs(z) * 0.35;
    p.setXYZ(i, x0, y, z);
  }
  g.computeVertexNormals();
  return g;
}

function palm(x, z, h, lean, ry) {

    const m = mk(cyl(0.2 * (1 - t * 0.4), 0.25 * (1 - t * 0.4), len * 1.04, 10), i % 2 ? '#c39460' : '#d6a872', g,
      (a.x + b.x) / 2, (a.y + b.y) / 2, 0, { ol: 0.025 });
    m.quaternion.setFromUnitVectors(new V3(0, 1, 0), b.clone().sub(a).normalize());

function spawnPuff(burst = 1) {
  const p = puffs.find(q => !q.alive);
  if (!p) return;
  p.alive = true; p.life = 0; p.max = rr(3.6, 5.0);
  p.m.position.copy(SMOKE_ORIGIN).add(new V3(rr(-0.1, 0.1), 0, rr(-0.1, 0.1)));
  p.vel.set(rr(0.15, 0.3), rr(0.85, 1.15) * burst, rr(-0.08, 0.08));
  p.spin = rr(-0.6, 0.6);
  p.m.visible = true;
}
const smokeDay = new THREE.Color('#ffffff'), smokeNight = new THREE.Color('#8e9cc4'), smokeCol = new THREE.Color();
function updateSmoke(dt) {
  smokeCol.copy(smokeDay).lerp(smokeNight, nightF);
  if (smokeOn) { smokeAcc += dt; while (smokeAcc > 0.26) { smokeAcc -= 0.26; spawnPuff(); } }
  for (const p of puffs) {
    if (!p.alive) continue;
    p.life += dt;
    const k = p.life / p.max;
    if (k >= 1) { p.alive = false; p.m.visible = false; continue; }
    p.vel.x += dt * 0.12; p.vel.y *= (1 - dt * 0.18);
    p.m.position.addScaledVector(p.vel, dt);
    p.m.position.x += Math.sin(p.life * 1.6 + p.max * 7) * dt * 0.15;
    p.m.rotation.y += p.spin * dt;
    p.m.scale.setScalar(0.2 + Math.pow(k, 0.7) * 1.25);
    p.m.material.color.copy(smokeCol);
    p.m.material.opacity = (k < 0.12 ? k / 0.12 : 1 - smooth(0.35, 1.0, k)) * 0.92;
  }
}

function findRoot(o) { while (o) { if (o.userData && o.userData.action) return o; o = o.parent; } return null; }
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);

  for (const h of hits) {

function setHighlight(root, on) {

let downX = 0, downY = 0, downT = 0;

/* ============================================================
   昼夜更新

function updateCycle() {
  const a = dayT * TAU - Math.PI / 2;
  const sx = Math.cos(a), sy = Math.sin(a);
  sunDir.set(sx, sy * 0.92, -0.3).normalize();
  moonDir.set(-sx * 0.95, -sy * 0.85, -0.4).normalize();
  const sY = sunDir.y;
  const wDay = smooth(0.0, 0.36, sY);
  const wNight = 1 - smooth(-0.3, -0.03, sY);
  const wTwi = Math.max(0, 1 - wDay - wNight);
  const morning = smooth(-0.25, 0.25, sx);
  for (const c in cur) {
    tmpT.copy(PAL.dusk[c]).lerp(PAL.dawn[c], morning);
    const N = PAL.night[c], D = PAL.day[c];
    cur[c].setRGB(N.r * wNight + tmpT.r * wTwi + D.r * wDay, N.g * wNight + tmpT.g * wTwi + D.g * wDay, N.b * wNight + tmpT.b * wTwi + D.b * wDay);
  }
  nightF = 1 - smooth(-0.12, 0.1, sY);

  // 灯光
  const sunI = smooth(-0.04, 0.14, sY);
  sunLight.position.copy(sunDir).multiplyScalar(60);
  sunLight.intensity = sunI * 2.75;
  sunLight.color.copy(cur.sunL);
  sunLight.castShadow = sunI > 0.01;
  const moonI = smooth(0.0, 0.22, moonDir.y) * (1 - sunI);
  moonLight.position.copy(moonDir).multiplyScalar(60);
  moonLight.intensity = moonI * 1.1;
  moonLight.castShadow = moonI > 0.01;
  hemi.color.copy(cur.hemiS); hemi.groundColor.copy(cur.hemiG);
  hemi.intensity = lerp(1.05, 1.35, wDay);

  // 天空
  skyU.uTop.value.copy(cur.top); skyU.uHor.value.copy(cur.hor);
  skyU.uGlow.value.copy(cur.glow).multiplyScalar(wTwi * 1.0 + wDay * 0.45 + wNight * 0.15);
  skyU.uSunCol.value.copy(cur.sun);
  skyU.uSunDir.value.copy(sunDir); skyU.uMoonDir.value.copy(moonDir);
  skyU.uNight.value = smooth(0.15, 0.9, wNight + wTwi * 0.3);
  skyU.uMoonVis.value = lerp(0.35, 1.0, nightF);

  // 海洋
  oceanU.uDeep.value.copy(cur.deep); oceanU.uShallow.value.copy(cur.shallow); oceanU.uFoam.value.copy(cur.foam);
  oceanU.uFog.value.copy(cur.hor); oceanU.uSky.value.copy(cur.ref);
  oceanU.uSunDir.value.copy(sunDir); oceanU.uSunCol.value.copy(cur.sun);
  oceanU.uSunI.value = smooth(-0.02, 0.08, sY);
  oceanU.uMoonDir.value.copy(moonDir);
  oceanU.uMoonI.value = smooth(0.0, 0.15, moonDir.y) * nightF;
  oceanU.uNight.value = nightF;

  scene.fog.color.copy(cur.hor);
  outlineMat.color.copy(cur.outline);
  rimU.uRimColor.value.copy(cur.rim);
  rimU.uRimPower.value = lerp(0.3, 0.55, wTwi);
  cloudMat.emissive.copy(cur.glow).multiplyScalar(0.18 * wTwi).add(tmpT.copy(cur.hor).multiplyScalar(0.12));
  gradePass.uniforms.uTint.value.copy(cur.tint);
  bloom.strength = lerp(0.38, 0.75, nightF);
  petalU.uLight.value = lerp(1.0, 0.45, nightF);

  // 人造光源
  lightsK = lerp(lightsK, lightsOn ? 1 : 0, 0.08);
  const indoor = nightF * lightsK;
  glassMat.emissiveIntensity = indoor * 1.5;
  lampMat.emissiveIntensity = indoor * 1.8;
  porchLight.intensity = indoor * 1.6;
  const dOpen = clamp(-doorAng / 1.8, 0, 1);
  doorLight.intensity = dOpen * (0.6 + indoor * 3.2);
  interiorMat.color.setScalar(0.6 + 0.2 * (1 - nightF) + indoor * 0.7);
  for (const L of [lanternA, lanternB]) {
    L.k = lerp(L.k ?? 1, L.on ? 1 : 0, 0.08);
    const v = L.k * nightF;
    L.mat.emissiveIntensity = v * 1.7;
    L.light.intensity = v * 2.2;
  }
  fireflyU.uOpacity.value = smooth(0.4, 0.9, nightF);
}

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0, introT = 0, introDone = false;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let firstFrame = true;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // 时间推进
  if (jump) {
    jump.t += dt / jump.dur;
    const k = easeIO(Math.min(jump.t, 1));
    dayT = (jump.from + (jump.to - jump.from) * k) % 1;
    if (jump.t >= 1) jump = null;
  } else if (playing) dayT = (dayT + dt * speed / DAY_LEN) % 1;
  updateCycle();

  oceanU.uTime.value = elapsed;
  skyU.uTime.value = elapsed;
  fireflyU.uTime.value = elapsed;
  petalU.uTime.value = elapsed;
  petalBoost = Math.max(0, petalBoost - dt * 0.25);
  petalU.uBoost.value = petalBoost;

  // 开场运镜
  if (!introDone) {
    introT += dt / 3.6;
    const k = easeOut(Math.min(introT, 1));
    camera.position.lerpVectors(CAM_START, CAM_END, k);
    camera.position.y += Math.sin(k * Math.PI) * 6;
    camera.lookAt(controls.target);
    if (introT >= 1) { introDone = true; controls.enabled = true; }
  } else {
    idleTimer += dt;
    controls.update();
  }
  sky.position.copy(camera.position);

  // 门：弹簧阻尼
  const target = doorOpen ? -1.85 : 0;
  doorVel += ((target - doorAng) * 38 - doorVel * 7.5) * dt;
  doorAng += doorVel * dt;
  doorPivot.rotation.y = doorAng;

  // 树摇晃
  for (const w of wobblers) {
    w.t += dt;
    const base = Math.sin(elapsed * 0.9 + w.obj.position.x) * 0.012;
    const k = w.amp * Math.exp(-w.t * 2.2) * Math.sin(w.t * 11);
    w.obj.rotation.z = base + k;
    w.obj.rotation.x = k * 0.5;
  }

  // 小船
  boatKick = Math.max(0, boatKick - dt * 0.5);
  boat.position.y = 0.32 + Math.sin(elapsed * 1.3) * 0.06 + Math.sin(elapsed * 4) * 0.05 * boatKick;
  boat.rotation.z = Math.sin(elapsed * 1.1) * 0.05 + Math.sin(elapsed * 5) * 0.18 * boatKick;
  boat.rotation.x = Math.sin(elapsed * 0.9 + 1) * 0.03;

  updateSmoke(dt);

  // 云
  cloudRoot.rotation.y += dt * 0.004;

  // 海鸥
  const dayVis = smooth(0.05, 0.25, sunDir.y);
  for (const b of gulls) {
    b.ph += dt * b.sp;
    const p = new V3(Math.cos(b.ph) * b.r, b.h + Math.sin(b.ph * 2.3) * 0.8, Math.sin(b.ph) * b.r);
    const nx = new V3(Math.cos(b.ph + 0.05 * Math.sign(b.sp)) * b.r, p.y, Math.sin(b.ph + 0.05 * Math.sign(b.sp)) * b.r);
    b.g.position.copy(p);
    b.g.lookAt(nx);
    b.g.rotateZ(-0.3 * Math.sign(b.sp));
    b.fl += dt;
    const glide = (Math.sin(b.fl * 0.5) > 0.3) ? 0.15 : 1;
    const f = Math.sin(b.fl * 9) * 0.55 * glide + 0.1;
    b.wings[0].rotation.z = f; b.wings[1].rotation.z = f;
    b.g.visible = dayVis > 0.02;
    b.g.scale.setScalar(dayVis);
  }

  // 流星
  if (nightF > 0.7) {
    if (!meteor.active) {
      meteor.next -= dt;
      if (meteor.next <= 0) {
        const az = rr(0, TAU), el = rr(0.35, 0.75), dir = rand() < 0.5 ? 1 : -1;
        meteor.S.copy(skyPoint(az, el, 600)); meteor.E.copy(skyPoint(az + dir * rr(0.25, 0.45), el - rr(0.15, 0.3), 600));
        meteor.active = true; meteor.t = 0; meteor.dur = rr(0.8, 1.4);
      }
    }
  }
  if (meteor.active) {
    meteor.t += dt / meteor.dur;
    const k = meteor.t;
    if (k >= 1) { meteor.active = false; meteor.next = rr(4, 10); meteorU.uA.value = 0; }
    else {
      const head = meteor.S.clone().lerp(meteor.E, k);
      const tail = meteor.S.clone().lerp(meteor.E, Math.max(0, k - 0.32));
      const side = new V3().subVectors(head, tail).cross(new V3().subVectors(head, camera.position)).normalize().multiplyScalar(1.3);
      const pa = meteor.m.geometry.attributes.position;
      pa.setXYZ(0, tail.x - side.x, tail.y - side.y, tail.z - side.z);
      pa.setXYZ(1, tail.x + side.x, tail.y + side.y, tail.z + side.z);
      pa.setXYZ(2, head.x - side.x, head.y - side.y, head.z - side.z);
      pa.setXYZ(3, head.x + side.x, head.y + side.y, head.z + side.z);
      pa.needsUpdate = true;
      meteorU.uA.value = Math.sin(k * Math.PI) * nightF;
    }
  }

  doHover();
  updateUI();
  composer.render();

  if (firstFrame) { firstFrame = false; setTimeout(() => document.getElementById('loader').classList.add('hide'), 250); }
}
renderer.setAnimationLoop(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth, innerHeight);
  updatePointScale();
});
window.__scene = { scene, camera, controls, get dayT() { return dayT; }, set dayT(v) { dayT = v; } };
</script>
</body>
</html>
