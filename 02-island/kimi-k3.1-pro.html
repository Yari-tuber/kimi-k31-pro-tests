    <div class="top-actions"><button class="round-btn glass" id="soundBtn" title="开启环境音" aria-label="开启环境音"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-wave" d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg></button><button class="round-btn glass" id="resetBtn" title="回到初始视角" aria-label="重置视角"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/></svg></button></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const $ = s => document.querySelector(s);

    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);

    // Four-tone ramp keeps every surface softly cel-shaded.

    ramp.needsUpdate = true; ramp.minFilter = ramp.magFilter = THREE.NearestFilter;
    const toon = (color, extra={}) => new THREE.MeshToonMaterial({color, gradientMap:ramp, ...extra});
    const mat = {
      grass:toon(0x8eaf79), grassLight:toon(0xb2c68c), sand:toon(0xe7cf9e), rock:toon(0x9a9b85),
      cream:toon(0xf3dfb8), plaster:toon(0xf5e8cb), roof:toon(0xb96951), roofLight:toon(0xcf7c5c),
      wood:toon(0x805b42), darkWood:toon(0x543f32), leaf:toon(0x6f9b78), leafLight:toon(0x9db680),
      white:toon(0xfff4dc), stone:toon(0xb9b7a0), pink:toon(0xe9a99a), yellow:toon(0xf2cc74),

    function cylinder(rt,rb,h,material,parent,x=0,y=0,z=0,n=24){const m=mesh(new THREE.CylinderGeometry(rt,rb,h,n),material,parent);m.position.set(x,y,z);return m}
    function outline(object, color=0x50665b, opacity=.25){const lines=new THREE.LineSegments(new THREE.EdgesGeometry(object.geometry,28),new THREE.LineBasicMaterial({color,transparent:true,opacity}));lines.position.copy(object.position);lines.rotation.copy(object.rotation);lines.scale.copy(object.scale);object.parent.add(lines);return lines}

    // Atmospheric sky dome, with a continuous dawn/day/dusk/night palette.
    const skyUniforms={topColor:{value:new THREE.Color(0x79b7c7)},bottomColor:{value:new THREE.Color(0xf5dfb5)},offset:{value:15},exponent:{value:.65}};
    const sky=mesh(new THREE.SphereGeometry(110,32,20),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyUniforms,vertexShader:`varying vec3 vWorld;void main(){vec4 w=modelMatrix*vec4(position,1.);vWorld=w.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform vec3 topColor;uniform vec3 bottomColor;uniform float offset;uniform float exponent;varying vec3 vWorld;void main(){float h=normalize(vWorld+vec3(0.,offset,0.)).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.),exponent),0.)),1.);}`}),scene,false);

    const hemi=new THREE.HemisphereLight(0xdaf0e5,0x6f7662,2.15);scene.add(hemi);
    const sunLight=new THREE.DirectionalLight(0xffe2b0,3.4);sunLight.castShadow=true;sunLight.shadow.mapSize.set(2048,2048);sunLight.shadow.camera.left=-14;sunLight.shadow.camera.right=14;sunLight.shadow.camera.top=14;sunLight.shadow.camera.bottom=-14;sunLight.shadow.camera.near=.5;sunLight.shadow.camera.far=65;sunLight.shadow.bias=-.0008;scene.add(sunLight);
    const fillLight=new THREE.DirectionalLight(0x9cc5c3,.5);fillLight.position.set(-10,8,-8);scene.add(fillLight);

    const sun=mesh(new THREE.SphereGeometry(2.1,24,16),new THREE.MeshBasicMaterial({color:0xffdc91,fog:false}),scene,false);
    const moon=mesh(new THREE.SphereGeometry(1.45,24,16),new THREE.MeshBasicMaterial({color:0xe9efd7,fog:false}),scene,false);
    const sunHalo=mesh(new THREE.SphereGeometry(3.2,20,14),new THREE.MeshBasicMaterial({color:0xffd79a,transparent:true,opacity:.1,depthWrite:false,fog:false}),scene,false);

    const starGeo=new THREE.BufferGeometry();const starPos=[];let seed=42;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
    for(let i=0;i<450;i++){const a=rnd()*Math.PI*2,y=15+rnd()*65,r=85;starPos.push(Math.cos(a)*r,y,Math.sin(a)*r)}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
    const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xf5f0d3,size:.18,transparent:true,opacity:0,depthWrite:false,fog:false}));scene.add(stars);

    // Hand-shaped low-poly island and soft layered shoreline.
    const island=new THREE.Group();scene.add(island);
    const sandBase=cylinder(5.25,6.25,1.45,mat.sand,island,0,-.15,0,64);sandBase.scale.z=.83;
    const rockBase=cylinder(5.65,6.55,.8,mat.rock,island,0,-1.05,0,48);rockBase.scale.z=.82;
    const grassTop=cylinder(4.92,5.25,.52,mat.grass,island,0,.74,0,64);grassTop.scale.z=.82;
    const pos=grassTop.geometry.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),a=Math.atan2(z,x);const f=1+.035*Math.sin(a*5)+.02*Math.cos(a*9);pos.setX(i,x*f);pos.setZ(i,z*f)}pos.needsUpdate=true;grassTop.geometry.computeVertexNormals();

    // Ocean shader: broad illustrated waves, tiny glints and horizon haze.
    const oceanUniforms={uTime:{value:0},uDay:{value:1},uSun:{value:new THREE.Vector3(1,1,0)},uDeep:{value:new THREE.Color(0x4f9d9c)},uShallow:{value:new THREE.Color(0x91c5b6)},uGlint:{value:new THREE.Color(0xfff0c9)},uHorizon:{value:new THREE.Color(0xe6edcf)}};
    const oceanMat=new THREE.ShaderMaterial({uniforms:oceanUniforms,side:THREE.DoubleSide,vertexShader:`uniform float uTime;varying vec3 vPos;varying float vWave;void main(){vec3 p=position;float w=sin(p.x*.55+uTime*.65)*.09+cos(p.y*.43-uTime*.5)*.075+sin((p.x+p.y)*.22+uTime*.35)*.1;p.z+=w;vWave=w;vec4 world=modelMatrix*vec4(p,1.);vPos=world.xyz;gl_Position=projectionMatrix*viewMatrix*world;}`,fragmentShader:`uniform float uTime;uniform float uDay;uniform vec3 uDeep;uniform vec3 uShallow;uniform vec3 uGlint;uniform vec3 uHorizon;varying vec3 vPos;varying float vWave;void main(){float bands=smoothstep(-.12,.19,vWave);vec3 col=mix(uDeep,uShallow,bands*.68+.16);float ripple=sin(vPos.x*2.1+sin(vPos.z*.8)+uTime)*sin(vPos.z*2.4-uTime*.7);float fine=pow(max(0.,ripple),18.);float sparkle=pow(max(0.,sin(vPos.x*5.3+vPos.z*3.7+uTime*1.4)),42.)*pow(max(0.,sin(vPos.z*4.1-uTime)),10.);col+=uGlint*(fine*.12+sparkle*.32)*(.35+uDay*.65);float dist=length(vPos.xz);col=mix(col,uShallow,smoothstep(28.,85.,dist)*.32);col=mix(col,uHorizon,smoothstep(60.,175.,dist));gl_FragColor=vec4(col,1.);}`});
    const ocean=mesh(new THREE.PlaneGeometry(400,400,180,180),oceanMat,scene,false);ocean.rotation.x=-Math.PI/2;ocean.position.y=-.46;

    // Cottage: warm plaster, a chunky terracotta gable, timber trims and glowing windows.
    const house=new THREE.Group();house.position.set(-.35,1.03,-.15);house.rotation.y=-.12;island.add(house);
    const walls=box(4.25,2.65,3.5,mat.plaster,house,0,1.35,0);outline(walls,0x7b7562,.2);
    box(4.5,.22,3.72,mat.darkWood,house,0,.1,0);
    const roofShape=new THREE.Shape();roofShape.moveTo(-2.55,0);roofShape.lineTo(0,1.72);roofShape.lineTo(2.55,0);roofShape.closePath();
    const roofGeo=new THREE.ExtrudeGeometry(roofShape,{depth:4.15,bevelEnabled:false});roofGeo.translate(0,0,-2.075);
    const roof=mesh(roofGeo,mat.roof,house);roof.position.y=2.68;outline(roof,0x6d493d,.36);
    // Roof ribs are intentionally sparse, like ink strokes in an illustration.
    for(let z=-1.7;z<=1.7;z+=.68){const leftRib=box(3.08,.04,.05,mat.roofLight,house,-1.275,3.54,z);leftRib.rotation.z=.594;const rightRib=box(3.08,.04,.05,mat.roofLight,house,1.275,3.54,z);rightRib.rotation.z=-.594;}
    box(.14,.16,4.35,mat.roofLight,house,0,4.4,0);
    const beamMat=mat.wood;box(.15,2.7,.16,beamMat,house,-2.04,1.36,1.77);box(.15,2.7,.16,beamMat,house,2.04,1.36,1.77);box(4.3,.14,.16,beamMat,house,0,2.52,1.77);
    // Door pivot at its left jamb.

    const door=box(1.28,2.12,.13,mat.wood,doorPivot,.64,1.06,0);door.name='door';
    for(let y=.4;y<1.95;y+=.5)box(1.1,.055,.04,mat.darkWood,doorPivot,.64,y,.085);

    const doorFrame=box(1.52,2.35,.16,mat.darkWood,house,0,1.27,1.72);doorFrame.material=mat.darkWood;
    // Re-add a dark inset behind the moving door, avoiding a flat closed-door look.
    box(1.32,2.16,.08,toon(0x302e29),house,0,1.23,1.70);
    house.remove(doorFrame); // frame jambs below preserve an open doorway
    box(.13,2.36,.19,mat.darkWood,house,-.73,1.28,1.82);box(.13,2.36,.19,mat.darkWood,house,.73,1.28,1.82);box(1.58,.13,.19,mat.darkWood,house,0,2.42,1.82);
    const windowMat=toon(0x91b8ad,{emissive:0xffc66d,emissiveIntensity:0});
    const windows=[];function frontWindow(x){const w=box(.87,1.02,.09,windowMat,house,x,1.48,1.81);windows.push(w);box(.06,1.08,.12,mat.white,house,x,1.48,1.88);box(.93,.06,.12,mat.white,house,x,1.48,1.88);box(1.05,.13,.26,mat.wood,house,x,.93,1.88)}frontWindow(-1.4);frontWindow(1.4);
    const sideWindow=box(.09,1.0,1.15,windowMat,house,2.17,1.5,-.25);windows.push(sideWindow);box(.13,.06,1.2,mat.white,house,2.23,1.5,-.25);box(.13,1.05,.06,mat.white,house,2.23,1.5,-.25);
    const chimney=box(.63,1.75,.65,mat.rock,house,1.18,3.77,-.65);chimney.name='chimney';const chimneyCap=box(.82,.18,.83,mat.darkWood,house,1.18,4.68,-.65);chimneyCap.name='chimney';
    for(let y=3.2;y<4.5;y+=.32)box(.67,.035,.68,mat.sand,house,1.18,y,-.65);
    // Stone steps and an imperfect little path.
    box(1.65,.2,.62,mat.stone,house,0,.03,2.08);box(1.9,.12,.68,mat.stone,house,0,-.08,2.45);
    for(let i=0;i<6;i++){const p=cylinder(.42,.5,.1,mat.stone,island,-.3+Math.sin(i)*.25,1.07,3.2+i*.38,7);p.scale.z=.7;p.rotation.y=i*.7}

    // Rounded trees, shrubs and flower dots build the storybook silhouette.
    function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,1,z);g.scale.setScalar(s);island.add(g);const trunk=cylinder(.16,.23,2.15,mat.wood,g,0,1.0,0,9);trunk.rotation.z=.06;sphere(1.05,mat.leaf,g,0,2.5,0,1,1.1,1);sphere(.8,mat.leafLight,g,-.65,2.2,.12);sphere(.72,mat.leaf,g,.65,2.35,-.12);sphere(.62,mat.leafLight,g,.2,3.13,.08);return g}
    tree(-3.35,-1.5,1.05);tree(3.25,-1.85,.83);tree(-3.85,1.1,.58);
    function bush(x,z,s=.5){sphere(s,mat.leafLight,island,x,1.12,z,1.25,.75,1);sphere(s*.72,mat.leaf,island,x+s*.55,1.08,z+.05,1,.8,1)}
    [[-2.8,2.8],[2.8,1.6],[3.8,.4],[-3.1,-2.8],[1.7,-3.4]].forEach((p,i)=>bush(p[0],p[1],.45+(i%2)*.14));
    for(let i=0;i<28;i++){const a=rnd()*Math.PI*2,r=3.2+rnd()*1.3,x=Math.cos(a)*r,z=Math.sin(a)*r*.76;if(z>1.7&&Math.abs(x)<1.1)continue;const stem=cylinder(.018,.025,.25,mat.leaf,island,x,1.13,z,5);sphere(.085,i%3===0?mat.pink:mat.yellow,island,x,1.29,z,1,.65,1)}
    // A small fence at the cliff edge.
    const fence=new THREE.Group();fence.position.set(2.45,1.05,2.1);fence.rotation.y=-.35;island.add(fence);for(let i=0;i<4;i++)box(.12,.83,.12,mat.white,fence,i*.67,.4,0);box(2.2,.11,.11,mat.white,fence,1,.55,0);box(2.2,.11,.11,mat.white,fence,1,.22,0);

    // Tiny rowboat, bobbing just offshore.
    const boat=new THREE.Group();boat.position.set(7,-.08,3.5);boat.rotation.y=-.5;scene.add(boat);
    const hull=mesh(new THREE.CapsuleGeometry(.56,1.65,4,12),mat.boat,boat);hull.rotation.x=Math.PI/2;hull.scale.set(1,.55,.36);hull.position.y=.05;
    box(.8,.09,1.8,mat.wood,boat,0,.19,0);box(.93,.12,.18,mat.sand,boat,0,.31,-.35);box(.93,.12,.18,mat.sand,boat,0,.31,.35);
    const oar=box(.07,.07,2.4,mat.darkWood,boat,.5,.36,0);oar.rotation.y=.35;

    // Puffy clouds are grouped clay-like lobes rather than image sprites.
    const clouds=[];function cloud(x,y,z,s){const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);const cm=toon(0xf4f1df,{transparent:true,opacity:.88});sphere(1.4,cm,g,0,0,0,1.8,.6,1);sphere(1.05,cm,g,-.7,.45,0);sphere(1.25,cm,g,.65,.55,0);clouds.push({g,speed:.12+rnd()*.12,baseX:x});}
    cloud(-18,13,-18,1.7);cloud(17,16,-24,2.1);cloud(-23,10,6,1.1);cloud(22,12,8,1.3);cloud(-5,13,-32,2.2);

    // Smoke uses reusable soft-edged canvas sprites and a gentle curling lifecycle.
    const smokeCanvas=document.createElement('canvas');smokeCanvas.width=smokeCanvas.height=64;const sx=smokeCanvas.getContext('2d');const sg=sx.createRadialGradient(32,32,3,32,32,30);sg.addColorStop(0,'rgba(248,243,221,.9)');sg.addColorStop(.45,'rgba(235,235,215,.55)');sg.addColorStop(1,'rgba(230,235,220,0)');sx.fillStyle=sg;sx.fillRect(0,0,64,64);const smokeTex=new THREE.CanvasTexture(smokeCanvas);
    const smokes=[];for(let i=0;i<22;i++){const sm=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:0}));scene.add(sm);smokes.push({s:sm,age:i/22,offset:rnd()*6.28});}
    const chimneyWorld=new THREE.Vector3();let smokeOn=true;
    // Fireflies switch on after sunset.
    const fireflies=[];for(let i=0;i<18;i++){const f=sphere(.025,new THREE.MeshBasicMaterial({color:0xffe992,transparent:true,opacity:0}),scene,(rnd()-.5)*9,1.4+rnd()*2,(rnd()-.5)*7,1,1,1);fireflies.push({f,phase:rnd()*6.28})}

    // Minimal gull marks, drifting high above the sea.
    const gulls=[];const gullMat=new THREE.LineBasicMaterial({color:0x5f756e,transparent:true,opacity:.65});for(let i=0;i<5;i++){const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.35,0,0),new THREE.Vector3(0,-.13,0),new THREE.Vector3(.35,0,0)]);const g=new THREE.Line(geo,gullMat);g.position.set((rnd()-.5)*22,8+rnd()*5,-7-rnd()*9);scene.add(g);gulls.push(g)}

    const interactables=[door,knob,chimney,chimneyCap];
    const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down={x:0,y:0};
    function hitTest(e){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);return raycaster.intersectObjects(interactables,false)[0]}
    renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
    renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)return;const hit=hitTest(e);if(!hit)return;if(hit.object.name==='door')toggleDoor();if(hit.object.name==='chimney')toggleSmoke()});
    renderer.domElement.addEventListener('pointermove',e=>{renderer.domElement.style.cursor=hitTest(e)?'pointer':'grab'});

    let doorOpen=false,doorAmount=0,toastTimer;
    function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
    function toggleDoor(){doorOpen=!doorOpen;$('#doorBtn').classList.toggle('active',doorOpen);$('#doorBtn .label').textContent=doorOpen?'掩上木门':'推开木门';toast(doorOpen?'门开了，进来坐坐吧':'轻轻掩上门，把海风留在窗外')}
    function toggleSmoke(){smokeOn=!smokeOn;$('#smokeBtn').classList.toggle('active',smokeOn);$('#smokeBtn .label').textContent=smokeOn?'收起炊烟':'升起炊烟';toast(smokeOn?'炉火正暖，晚饭快好了':'炊烟慢慢散进风里')}
    $('#doorBtn').addEventListener('click',toggleDoor);$('#smokeBtn').addEventListener('click',toggleSmoke);
    let dayTime=.354,autoCycle=true,wasNight=false;
    function toggleCycle(){autoCycle=!autoCycle;$('#cycleBtn').classList.toggle('active',autoCycle);$('#playIcon').textContent=autoCycle?'Ⅱ':'▶';$('#cycleBtn .label').textContent=autoCycle?'暂停时光':'昼夜流转';toast(autoCycle?'让晨昏继续慢慢流转':'把时间停在这一刻')}
    $('#cycleBtn').addEventListener('click',toggleCycle);$('#cycleBtn').classList.add('active');
    $('#timeSlider').addEventListener('input',e=>{dayTime=Number(e.target.value)/1000});
    let resetting=false;$('#resetBtn').addEventListener('click',()=>{resetting=true;toast('回到初见小岛的地方')});
    controls.addEventListener('start',()=>resetting=false);
    addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();toggleCycle()}if(e.key.toLowerCase()==='d')toggleDoor();if(e.key.toLowerCase()==='s')toggleSmoke()});

    // Optional synthesized sea ambience; no media files and no autoplay.
    let audioCtx,audioGain,soundOn=false;
    function makeSeaAudio(){audioCtx=new (window.AudioContext||window.webkitAudioContext)();const len=audioCtx.sampleRate*4,buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const white=Math.random()*2-1;last=(last+.02*white)/1.02;data[i]=last*3.2}const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=780;audioGain=audioCtx.createGain();audioGain.gain.value=0;src.connect(filter).connect(audioGain).connect(audioCtx.destination);src.start();const lfo=audioCtx.createOscillator(),lfoGain=audioCtx.createGain();lfo.frequency.value=.12;lfoGain.gain.value=.07;lfo.connect(lfoGain).connect(audioGain.gain);lfo.start()}
    $('#soundBtn').addEventListener('click',async()=>{if(!audioCtx)makeSeaAudio();await audioCtx.resume();soundOn=!soundOn;audioGain.gain.setTargetAtTime(soundOn?.16:0,audioCtx.currentTime,.5);$('#soundBtn').classList.toggle('active',soundOn);$('#soundBtn').style.background=soundOn?'#425f57':' ';$('#soundBtn').style.color=soundOn?'#fffdf5':'';$('#soundBtn').title=soundOn?'关闭环境音':'开启环境音';toast(soundOn?'听，海浪正轻轻靠岸':'只留眼前的风景')});

    const palettes={dayTop:new THREE.Color(0x78b5c5),dayBottom:new THREE.Color(0xe6edcf),dawnTop:new THREE.Color(0x829cae),dawnBottom:new THREE.Color(0xf2b58e),nightTop:new THREE.Color(0x152d45),nightBottom:new THREE.Color(0x536b76),fogDay:new THREE.Color(0xc7dfd7),fogNight:new THREE.Color(0x263e4b),seaDay:new THREE.Color(0x4f9d9c),seaNight:new THREE.Color(0x254e62),shallowDay:new THREE.Color(0x91c5b6),shallowNight:new THREE.Color(0x587c83)};
    const c1=new THREE.Color(),c2=new THREE.Color();
    function updateDay(dt,t){
      const angle=(dayTime-.25)*Math.PI*2,sunY=Math.sin(angle),sunX=Math.cos(angle);const daylight=THREE.MathUtils.smoothstep(sunY,-.16,.24);const dusk=Math.max(0,1-Math.abs(sunY)*4)*(.4+.6*Math.abs(sunX));
      const sunPos=new THREE.Vector3(sunX*55,sunY*48,-30);sun.position.copy(sunPos);sunHalo.position.copy(sunPos);moon.position.copy(sunPos).multiplyScalar(-1);sun.visible=sunY>-.13;sunHalo.visible=sun.visible;moon.visible=sunY<.16;
      sunLight.position.set(sunX*18,Math.max(2,sunY*24),8);sunLight.intensity=.15+daylight*3.1;sunLight.color.set(dusk>.25?0xffb078:0xffe3b4);hemi.intensity=.45+daylight*1.7;fillLight.intensity=.2+daylight*.35;
      skyUniforms.topColor.value.copy(palettes.nightTop).lerp(palettes.dayTop,daylight).lerp(palettes.dawnTop,dusk*.42);skyUniforms.bottomColor.value.copy(palettes.nightBottom).lerp(palettes.dayBottom,daylight).lerp(palettes.dawnBottom,dusk*.72);
      scene.fog.color.copy(palettes.fogNight).lerp(palettes.fogDay,daylight);oceanUniforms.uDeep.value.copy(palettes.seaNight).lerp(palettes.seaDay,daylight);oceanUniforms.uShallow.value.copy(palettes.shallowNight).lerp(palettes.shallowDay,daylight);oceanUniforms.uDay.value=daylight;oceanUniforms.uHorizon.value.copy(skyUniforms.bottomColor.value);
      stars.material.opacity=Math.pow(1-daylight,2)*.9;windows.forEach(w=>w.material.emissiveIntensity=(1-daylight)*1.7);renderer.toneMappingExposure=.78+daylight*.3;
      const night=daylight<.35;if(night!==wasNight){document.body.classList.toggle('night',night);wasNight=night}
      const hours=dayTime*24,h=Math.floor(hours),m=Math.floor((hours-h)*60);$('#clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      let phase='深夜 · 星光落在海面';if(h>=5&&h<8)phase='晨光 · 海风轻拂';else if(h>=8&&h<11)phase='上午 · 云影慢慢走';else if(h>=11&&h<15)phase='午后 · 日光晒暖屋檐';else if(h>=15&&h<18)phase='傍晚 · 等一场日落';else if(h>=18&&h<20)phase='暮色 · 灯火刚刚亮起';else if(h>=20||h<5)phase='夜晚 · 枕着潮声入眠';$('#phase').textContent=phase;
      $('.sun-path').style.setProperty('--sun-x',(dayTime*100)+'%');$('.sun-path').style.setProperty('--sun-y',(22-Math.max(-.2,sunY)*19)+'px');
      fireflies.forEach(({f,phase})=>{f.material.opacity=(1-daylight)*(.25+.65*Math.pow(Math.sin(t*2+phase)*.5+.5,2));f.position.y+=Math.sin(t+phase)*.0008});
    }

    const clock=new THREE.Clock();let elapsed=0,firstFrame=true;
    function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;if(autoCycle&&!reducedMotion)dayTime=(dayTime+dt/150)%1;$('#timeSlider').value=Math.round(dayTime*1000);updateDay(dt,elapsed);oceanUniforms.uTime.value=elapsed;
      doorAmount=THREE.MathUtils.damp(doorAmount,doorOpen?1:0,5,dt);doorPivot.rotation.y=-doorAmount*Math.PI*.57;
      chimneyCap.getWorldPosition(chimneyWorld);smokes.forEach((p,i)=>{p.age=(p.age+dt*(smokeOn?.16:.05))%1;const a=p.age,drift=a*a*2.1;p.s.position.set(chimneyWorld.x+Math.sin(a*5+p.offset)*.22+drift,chimneyWorld.y+.35+a*5.2,chimneyWorld.z+Math.cos(a*4+p.offset)*.18);const size=.35+a*1.75;p.s.scale.set(size,size,1);p.s.material.opacity=(smokeOn?1:Math.max(0,1-a*5))*Math.sin(a*Math.PI)*.56});
      clouds.forEach(c=>{c.g.position.x+=dt*c.speed;if(c.g.position.x>32)c.g.position.x=-32});boat.position.y=-.08+Math.sin(elapsed*.85)*.09;boat.rotation.z=Math.sin(elapsed*.7)*.035;foamRing.material.opacity=.38+Math.sin(elapsed*.9)*.1;foamRing.scale.set(1+Math.sin(elapsed*.65)*.015,(.83)+Math.sin(elapsed*.65)*.012,1);
      gulls.forEach((g,i)=>{g.position.x+=dt*(.22+i*.03);g.position.y+=Math.sin(elapsed*1.2+i)*.001;if(g.position.x>18)g.position.x=-18});
      if(resetting){camera.position.lerp(homeCamera,1-Math.exp(-dt*3));controls.target.lerp(new THREE.Vector3(0,1.8,0),1-Math.exp(-dt*3));if(camera.position.distanceTo(homeCamera)<.03)resetting=false}
      controls.update();renderer.render(scene,camera);if(firstFrame){firstFrame=false;setTimeout(()=>$('#loader').classList.add('done'),350)}
    }
    animate();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)clock.stop();else clock.start()});
  </script>
