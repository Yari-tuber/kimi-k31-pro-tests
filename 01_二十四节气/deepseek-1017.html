<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070908">
<title>二十四节气 · 节令</title>
<style>
  :root{
    --paper:#f4f0e5;
    --muted:rgba(244,240,229,.62);
    --dim:rgba(244,240,229,.36);
    --line:rgba(244,240,229,.15);
    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","STZhongsong","STSong","SimSun",serif;
    --sans:"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    --mono:"SFMono-Regular","Cascadia Mono","Roboto Mono","Consolas",monospace;
    --accent:#d7e6a8;
    --accent2:#73a379;
  }

  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;background:#070908;color:var(--paper);overflow:hidden;}
  body{
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    isolation:isolate;
  }

  .slides{position:absolute;inset:0;}

  .slide{
    position:absolute;
    inset:0;
    opacity:0;
    z-index:1;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .9s cubic-bezier(.4,0,.2,1);
  }
  .slide.is-active,.slide.is-leaving{visibility:visible;}
  .slide.is-active{opacity:1;z-index:3;}
  .slide.is-current{pointer-events:auto;}
  .slide.is-leaving{opacity:0;z-index:2;}

  .slide .bg{
    position:absolute;
    inset:0;
    background:
      radial-gradient(72% 68% at 72% 43%, var(--glow) 0%, transparent 62%),
      radial-gradient(52% 48% at 16% 86%, rgba(244,240,229,.035) 0%, transparent 72%),
      linear-gradient(148deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .slide .bg::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(90deg, transparent 0 49.95%, rgba(244,240,229,.028) 50%, transparent 50.05%),
      linear-gradient(0deg, transparent 0 49.95%, rgba(244,240,229,.022) 50%, transparent 50.05%);
    opacity:.42;
  }
  .slide .bg::after{
    content:"";
    position:absolute;
    width:64vw;
    aspect-ratio:1;
    right:2vw;
    top:50%;
    transform:translateY(-50%);
    border-radius:50%;
    background:radial-gradient(circle, var(--glow), transparent 66%);
    filter:blur(28px);
    opacity:.75;
  }

  .season-mark{
    position:absolute;
    left:-4.2vw;
    top:50%;
    transform:translateY(-50%);
    writing-mode:vertical-rl;
    font-family:var(--serif);
    font-weight:400;
    font-size:min(78vh,50vw);
    line-height:.82;
    letter-spacing:-.08em;
    color:transparent;
    -webkit-text-stroke:1px rgba(244,240,229,.065);
    z-index:0;
    pointer-events:none;
  }

  .slide-inner{
    position:absolute;
    inset:0;
    z-index:2;
    display:grid;
    grid-template-columns:minmax(390px,.94fr) minmax(0,1.06fr);
    align-items:center;
    gap:3vw;
    padding:96px 5.6vw 108px;
  }

  .copy{
    position:relative;
    justify-self:start;
    width:min(100%,660px);
    padding-left:2.2vw;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:13px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.22em;
    text-transform:uppercase;
    opacity:0;
  }
  .eyebrow .num{color:var(--accent);font-size:11px;letter-spacing:.16em;}
  .eyebrow .rule{display:block;width:48px;height:1px;background:var(--line);}
  .eyebrow .season{white-space:nowrap;}

  .term{
    display:flex;
    align-items:baseline;
    gap:.07em;
    margin:18px 0 16px;
    padding:0;
    font-family:var(--serif);
    font-size:clamp(96px,12.8vw,184px);
    font-weight:500;
    line-height:.88;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .term .ch{display:inline-block;overflow:hidden;padding:.08em .015em .16em;margin:-.08em 0 -.16em;}
  .term .ch > span{
    display:block;
    transform:translateY(116%) rotate(2deg);
    transform-origin:0 100%;
    color:var(--paper);
  }
  .term .ch:nth-child(2) > span{color:var(--accent);}
  .term .ch:nth-child(2) > span{animation-delay:.09s;}

  .latin{
    display:flex;
    align-items:baseline;
    gap:18px;
    flex-wrap:wrap;
    padding-top:2px;
    opacity:0;
  }
  .latin .py{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.32em;
    color:var(--accent);
  }
  .latin .en{
    font-size:9px;
    letter-spacing:.25em;
    color:var(--dim);
  }

  .copy-lower{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:clamp(24px,3.6vw,58px);
    width:min(100%,585px);
    margin-top:clamp(34px,6.7vh,68px);
    padding-top:18px;
    border-top:1px solid var(--line);
    opacity:0;
  }
  .poem-wrap{display:flex;gap:17px;min-width:0;}
  .poem-label{
    writing-mode:vertical-rl;
    font-family:var(--serif);
    font-size:9px;
    line-height:1;
    letter-spacing:.28em;
    color:var(--dim);
    padding-top:3px;
  }
  .poem{
    margin:0;
    font-family:var(--serif);
    font-size:clamp(17px,1.5vw,23px);
    font-weight:400;
    line-height:1.85;
    letter-spacing:.09em;
    color:rgba(244,240,229,.86);
    white-space:nowrap;
  }
  .poem span{display:block;}
  .poem span:last-child{color:var(--muted);}

  .facts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 22px;
    align-content:start;
    padding-top:2px;
  }
  .fact{min-width:0;}
  .fact .k{
    display:block;
    margin-bottom:6px;
    font-size:8px;
    letter-spacing:.17em;
    color:var(--dim);
    white-space:nowrap;
  }
  .fact .v{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--paper);
    white-space:nowrap;
  }
  .fact:first-child .v{color:var(--accent);}

  .art-wrap{
    position:relative;
    justify-self:center;
    align-self:center;
    width:min(47vw,63vh,650px);
    aspect-ratio:1;
  }
  .art-wrap::before{
    content:"";
    position:absolute;
    inset:1.2%;
    border-radius:50%;
    background:repeating-conic-gradient(from -.5deg,
      rgba(244,240,229,.32) 0 .62deg,
      transparent .62deg 15deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));
    opacity:.58;
    transform:rotate(-90deg);
  }
  .art-wrap::after{
    content:"";
    position:absolute;
    inset:2.8%;
    border:1px solid rgba(244,240,229,.13);
    border-radius:50%;
  }

  .disc{
    position:absolute;
    inset:6.2%;
    overflow:hidden;
    border-radius:50%;
    border:1px solid rgba(244,240,229,.17);
    background:
      radial-gradient(circle at 50% 43%, var(--glow), transparent 62%),
      radial-gradient(circle at 50% 100%, rgba(0,0,0,.22), transparent 58%);
    box-shadow:
      inset 0 0 90px rgba(0,0,0,.48),
      0 32px 80px rgba(0,0,0,.32);
  }

  .art-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    color:var(--accent);
    overflow:visible;
  }
  .art-svg .guide{fill:none;stroke:currentColor;stroke-width:.8;opacity:.13;}
  .art-svg .guide .faint{opacity:.55;}
  .art-svg .s{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;}
  .art-svg .s2{fill:none;stroke:currentColor;stroke-width:.75;stroke-linecap:round;stroke-linejoin:round;opacity:.55;}
  .art-svg .so{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-width:1.15;stroke-linejoin:round;}
  .art-svg .so2{fill:currentColor;fill-opacity:.14;stroke:currentColor;stroke-width:1.15;stroke-linejoin:round;}
  .art-svg .f{fill:currentColor;fill-opacity:.1;stroke:none;}
  .art-svg .f2{fill:currentColor;fill-opacity:.23;stroke:none;}
  .art-svg .dot{fill:currentColor;stroke:none;}
  .art-svg .c2{color:var(--accent2);}
  .art-svg .warm{color:var(--accent2);}

  .orbit-mark{
    position:absolute;
    inset:1.2%;
    border-radius:50%;
    pointer-events:none;
  }
  .orbit-mark::before{
    content:"";
    position:absolute;
    top:-2px;
    left:calc(50% - 2.5px);
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 16px var(--accent);
    opacity:.9;
  }

  .plate{
    position:absolute;
    left:50%;
    bottom:-15px;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:7.5px;
    letter-spacing:.22em;
    color:var(--dim);
    white-space:nowrap;
  }
  .plate i{font-style:normal;color:var(--accent);margin:0 7px;}

  .slide.is-active .eyebrow{animation:fadeUp .8s .08s cubic-bezier(.2,.7,.2,1) both;}
  .slide.is-active .term .ch > span{animation:charUp 1.1s cubic-bezier(.16,1,.3,1) both;}
  .slide.is-active .term .ch:nth-child(1) > span{animation-delay:.08s;}
  .slide.is-active .term .ch:nth-child(2) > span{animation-delay:.17s;}
  .slide.is-active .latin{animation:fadeUp .85s .34s cubic-bezier(.2,.7,.2,1) both;}
  .slide.is-active .copy-lower{animation:fadeUp .9s .43s cubic-bezier(.2,.7,.2,1) both;}
  .slide.is-active .art-wrap{animation:artIn 1.35s .14s cubic-bezier(.16,1,.3,1) both;}
  .slide.is-active .orbit-mark{animation:spin 110s linear infinite;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes charUp{from{transform:translateY(116%) rotate(2deg);}to{transform:translateY(0) rotate(0);}}
  @keyframes artIn{from{opacity:0;transform:scale(.93) rotate(-1.5deg);}to{opacity:1;transform:scale(1) rotate(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes spinRev{to{transform:rotate(-360deg);}}
  @keyframes sway{0%,100%{transform:rotate(-1.35deg);}50%{transform:rotate(1.35deg);}}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes drift{0%,100%{transform:translateX(-9px);}50%{transform:translateX(9px);}}
  @keyframes driftFar{0%,100%{transform:translateX(-16px);}50%{transform:translateX(16px);}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
  @keyframes breathe{0%,100%{opacity:.45;}50%{opacity:1;}}
  @keyframes flicker{0%,88%,100%{opacity:1;}90%{opacity:.2;}93%{opacity:1;}95%{opacity:.35;}97%{opacity:1;}}
  @keyframes rainFall{0%{transform:translateY(-16px);opacity:0;}16%{opacity:.8;}82%{opacity:.52;}100%{transform:translateY(64px);opacity:0;}}
  @keyframes snowFall{0%{transform:translateY(-16px) translateX(0);opacity:0;}12%{opacity:.9;}100%{transform:translateY(112px) translateX(9px);opacity:0;}}
  @keyframes ripple{0%{transform:scale(.68);opacity:.6;}100%{transform:scale(1.35);opacity:0;}}
  @keyframes shimmer{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes fallLeaf{0%{transform:translateY(-20px) rotate(-8deg);opacity:0;}18%{opacity:1;}100%{transform:translateY(76px) rotate(22deg);opacity:0;}}
  @keyframes smoke{0%{transform:translateY(0);opacity:.4;}100%{transform:translateY(-34px);opacity:0;}}
  @keyframes wing{0%,100%{transform:rotate(0deg);}50%{transform:rotate(5deg);}}

  .slide.is-active .art-svg .spin{animation:spin var(--dur,100s) linear infinite;}
  .slide.is-active .art-svg .spinRev{animation:spinRev var(--dur,120s) linear infinite;}
  .slide.is-active .art-svg .sway{animation:sway var(--dur,5.6s) ease-in-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .float{animation:float var(--dur,6s) ease-in-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .drift{animation:drift var(--dur,8s) ease-in-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .driftFar{animation:driftFar var(--dur,12s) ease-in-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .pulse{animation:pulse var(--dur,4.8s) ease-in-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .breathe{animation:breathe var(--dur,5s) ease-in-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .flicker{animation:flicker 4.2s steps(1,end) infinite;}
  .slide.is-active .art-svg .rain{animation:rainFall 1.7s linear infinite;animation-delay:calc(var(--i,0) * -.19s);}
  .slide.is-active .art-svg .snow{animation:snowFall var(--dur,7s) linear infinite;animation-delay:calc(var(--i,0) * -.62s);}
  .slide.is-active .art-svg .ripple{animation:ripple 2.6s ease-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .shimmer{animation:shimmer var(--dur,4s) ease-in-out infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .fall{animation:fallLeaf var(--dur,7s) linear infinite;animation-delay:var(--d,0s);}
  .slide.is-active .art-svg .smoke{animation:smoke 4.5s ease-out infinite;}
  .slide.is-active .art-svg .wing{animation:wing 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 50%;}

  .art-svg .spin,.art-svg .spinRev{transform-box:view-box;transform-origin:var(--ox,220px) var(--oy,220px);}
  .art-svg .sway{transform-box:view-box;transform-origin:var(--ox,220px) var(--oy,340px);}
  .art-svg .pulse,.art-svg .float,.art-svg .fall,.art-svg .shimmer{transform-box:fill-box;transform-origin:center;}
  .art-svg .ripple{transform-box:fill-box;transform-origin:center;}

  /* frame, texture and chrome */
  .frame{
    position:absolute;
    inset:16px;
    z-index:32;
    border:1px solid rgba(244,240,229,.075);
    pointer-events:none;
  }
  .grain{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:45;
    opacity:.17;
    mix-blend-mode:overlay;
    pointer-events:none;
  }
  .vignette{
    position:absolute;
    inset:0;
    z-index:44;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%, transparent 42%, rgba(0,0,0,.5) 100%);
  }

  .topbar{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    right:0;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:max(27px,3.5vh) 5.4vw;
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:14px;justify-self:start;}
  .brand-zh{
    font-family:var(--serif);
    font-size:17px;
    letter-spacing:.32em;
    color:var(--paper);
    line-height:1;
  }
  .brand-en{
    font-family:var(--mono);
    font-size:7px;
    line-height:1.65;
    letter-spacing:.19em;
    color:var(--dim);
  }
  .cycle{
    font-family:var(--mono);
    font-size:8px;
    letter-spacing:.22em;
    color:var(--dim);
    white-space:nowrap;
  }
  .cycle i{font-style:normal;color:var(--accent);margin:0 8px;}
  .count{
    justify-self:end;
    display:flex;
    align-items:baseline;
    gap:7px;
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.12em;
    color:var(--dim);
  }
  .count span{font-size:19px;line-height:1;color:var(--accent);letter-spacing:.02em;}
  .count em{font-style:normal;}

  .bottombar{
    position:absolute;
    z-index:20;
    left:5.4vw;
    right:5.4vw;
    bottom:max(23px,3.2vh);
  }
  .ticks{
    display:flex;
    align-items:flex-end;
    width:100%;
    height:26px;
  }
  .tick{
    flex:1 1 auto;
    height:26px;
    padding:0;
    border:0;
    background:none;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    cursor:pointer;
    outline:none;
  }
  .tick span{
    display:block;
    width:1px;
    height:6px;
    background:rgba(244,240,229,.17);
    transition:height .4s cubic-bezier(.2,.7,.2,1),background .4s,opacity .4s,box-shadow .4s;
  }
  .tick.done span{height:9px;background:var(--tick);opacity:.3;}
  .tick.is-current span{height:22px;width:2px;background:var(--tick);opacity:1;box-shadow:0 0 12px var(--tick);}
  .tick:hover span{height:16px;background:var(--tick);opacity:.75;}
  .rail{
    position:relative;
    height:1px;
    margin-top:9px;
    background:rgba(244,240,229,.09);
    overflow:hidden;
  }
  .rail i{
    position:absolute;
    inset:0;
    display:block;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:0 50%;
    box-shadow:0 0 10px var(--accent);
  }
  .footline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-top:12px;
    font-family:var(--mono);
    font-size:8px;
    letter-spacing:.19em;
    color:var(--dim);
  }
  .hint{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .hint .auto{color:rgba(244,240,229,.24);letter-spacing:.13em;}
  .hint kbd{
    font-family:var(--mono);
    font-size:8px;
    letter-spacing:.14em;
    color:var(--accent);
    border:1px solid rgba(244,240,229,.2);
    border-radius:2px;
    padding:3px 6px 2px;
    line-height:1;
  }

  @media (max-width:1050px){
    .slide-inner{grid-template-columns:minmax(330px,.96fr) minmax(0,1.04fr);gap:1vw;padding-top:90px;padding-bottom:104px;}
    .term{font-size:clamp(88px,13.4vw,160px);}
    .copy-lower{grid-template-columns:1fr;gap:18px;margin-top:34px;width:min(100%,480px);}
    .facts{grid-template-columns:1fr 1fr;max-width:370px;}
    .cycle{display:none;}
    .topbar{grid-template-columns:1fr 1fr;}
    .count{grid-column:2;}
    .art-wrap{width:min(50vw,58vh,560px);}
  }

  @media (max-width:760px), (max-aspect-ratio:3/4){
    .frame{inset:10px;}
    .topbar{padding:24px 7vw;}
    .brand-zh{font-size:15px;}
    .brand-en{display:none;}
    .count span{font-size:16px;}
    .slide-inner{
      display:block;
      padding:82px 7vw 108px;
    }
    .copy{
      width:100%;
      padding-left:0;
      display:flex;
      flex-direction:column;
      height:100%;
    }
    .eyebrow{gap:9px;font-size:8px;letter-spacing:.16em;}
    .eyebrow .rule{width:30px;}
    .term{
      font-size:clamp(82px,24vw,132px);
      margin:14px 0 12px;
      position:relative;
      z-index:3;
    }
    .term .ch:nth-child(2) > span{color:var(--accent);}
    .latin{gap:10px;}
    .latin .py{font-size:8px;letter-spacing:.24em;}
    .latin .en{font-size:7px;letter-spacing:.18em;}
    .copy-lower{
      display:block;
      width:min(72vw,360px);
      margin-top:auto;
      padding-top:15px;
      position:relative;
      z-index:3;
    }
    .poem{font-size:17px;line-height:1.8;white-space:normal;}
    .poem-wrap{gap:12px;}
    .facts{grid-template-columns:1fr 1fr;gap:12px;margin-top:19px;max-width:310px;}
    .fact .k{font-size:7px;}
    .fact .v{font-size:9px;}
    .art-wrap{
      position:absolute;
      z-index:1;
      width:min(94vw,58vh,470px);
      right:-14vw;
      top:28vh;
      opacity:.66;
    }
    .art-wrap::before,.art-wrap::after{opacity:.45;}
    .plate{display:none;}
    .season-mark{
      left:-14vw;
      font-size:min(64vh,74vw);
      opacity:.9;
      -webkit-text-stroke-color:rgba(244,240,229,.055);
    }
    .slide .bg::after{width:100vw;right:-40vw;top:42vh;opacity:.8;}
    .bottombar{left:7vw;right:7vw;bottom:max(20px,2.8vh);}
    .tick span{width:1px;}
    .tick.done span,.tick.is-current span{width:1.5px;}
    .footline{font-size:7px;letter-spacing:.13em;}
    .hint{gap:6px;}
    .hint kbd{font-size:7px;padding:2px 4px 1px;}
  }

  @media (max-height:690px) and (min-width:761px){
    .slide-inner{padding-top:76px;padding-bottom:88px;}
    .term{font-size:clamp(76px,10.4vw,132px);margin:12px 0;}

const SEASON_ORDER = ["SPRING","SUMMER","AUTUMN","WINTER"];

const slidesEl = document.getElementById("slides");
const ticksEl = document.getElementById("ticks");
const countEl = document.getElementById("count");
const footSeasonEl = document.getElementById("footSeason");
const railEl = document.getElementById("rail");
const root = document.documentElement;

const pad = n => String(n).padStart(2,"0");

function artSVG(inner){
  return `<svg class="art-svg" viewBox="0 0 440 440" aria-hidden="true">
    <g class="guide">
      <circle cx="220" cy="220" r="196"/>
      <circle cx="220" cy="220" r="178" stroke-dasharray="1 8" class="faint"/>
      <path d="M220 12v18M220 410v18M12 220h18M410 220h18" class="faint"/>
    </g>
    ${inner}
  </svg>`;
}

slidesEl.innerHTML = TERMS.map((t,i)=>`
  <section class="slide" data-i="${i}" aria-label="${t.zh} ${t.en}"
    style="--bg:${t.c.bg};--bg2:${t.c.bg2};--accent:${t.c.accent};--accent2:${t.c.accent2};--glow:${t.c.glow};">
    <div class="bg"></div>
    <div class="season-mark" aria-hidden="true">${t.season}</div>
    <div class="slide-inner">
      <div class="copy">
        <div class="eyebrow">
          <span class="num">${pad(i+1)}</span>
          <span class="rule"></span>
          <span class="season">${t.season} · ${t.seasonEn}</span>
        </div>
        <h1 class="term" aria-label="${t.zh}">
          <span class="ch"><span>${t.zh[0]}</span></span><span class="ch"><span>${t.zh[1]}</span></span>
        </h1>
        <div class="latin">
          <span class="py">${t.py}</span>
          <span class="en">${t.en}</span>
        </div>
        <div class="copy-lower">
          <div class="poem-wrap">
            <span class="poem-label">三候</span>
            <p class="poem"><span>${t.poem[0]}</span><span>${t.poem[1]}</span></p>
          </div>
          <div class="facts">
            <div class="fact"><span class="k">太阳黄经</span><span class="v">${t.lon}</span></div>
            <div class="fact"><span class="k">公历</span><span class="v">${t.date}</span></div>
          </div>
        </div>
      </div>
      <div class="art-wrap">
        <div class="disc">${artSVG(t.art)}</div>
        <div class="orbit-mark"></div>
        <div class="plate">FIG. ${pad(i+1)}<i>/</i>${t.zh}</div>
      </div>
    </div>
  </section>
`).join("");

ticksEl.innerHTML = TERMS.map((t,i)=>`
  <button class="tick" type="button" data-i="${i}" style="--tick:${t.c.accent}" aria-label="第 ${i+1} 个节气：${t.zh}" title="${pad(i+1)} ${t.zh} · ${t.en}">
    <span></span>
  </button>
`).join("");

const slides = Array.from(slidesEl.querySelectorAll(".slide"));
const ticks = Array.from(ticksEl.querySelectorAll(".tick"));
const params = new URLSearchParams(location.search);
const stillMode = params.has("still");
const staticMode = params.has("static");
if(staticMode) document.documentElement.classList.add("static");
const startAt = Math.max(0, Math.min(23, (parseInt(params.get("scene"),10)||1) - 1));
const DURATION = 5000;

let current = -1;
let sceneStart = performance.now();
let lastTick = performance.now();

function updateChrome(i){
  const t = TERMS[i];
  countEl.textContent = pad(i+1);
  footSeasonEl.textContent = `${t.seasonEn} · ${t.season}`;
  root.style.setProperty("--accent", t.c.accent);
  root.style.setProperty("--accent2", t.c.accent2);
  ticks.forEach((tick, n)=>{
    tick.classList.toggle("is-current", n === i);
    tick.classList.toggle("done", n < i);
  });
}

function goTo(index, opts={}){
  const i = ((index % TERMS.length) + TERMS.length) % TERMS.length;
  if(i === current) return;

  const prev = slidesEl.querySelector(".slide.is-current");
  if(prev && prev !== slides[i]){
    prev.classList.remove("is-current");
    prev.classList.add("is-leaving");
    clearTimeout(prev._leaveTimer);
    prev._leaveTimer = setTimeout(()=>{
      prev.classList.remove("is-active","is-leaving");
    }, 1000);
  }

  slides.forEach((slide, n)=>{
    if(n !== i && slide !== prev){
      clearTimeout(slide._leaveTimer);
      slide.classList.remove("is-active","is-leaving","is-current");
    }
  });

  const next = slides[i];
  clearTimeout(next._leaveTimer);
  next.classList.remove("is-leaving");
  next.classList.add("is-active","is-current");
  next.setAttribute("aria-hidden","false");
  slides.forEach((slide,n)=>{
    if(n !== i) slide.setAttribute("aria-hidden","true");
  });

  current = i;
  updateChrome(i);
  sceneStart = performance.now();
  lastTick = sceneStart;
  railEl.style.transform = "scaleX(0)";
}

function animate(now){
  if(!stillMode){
    const p = Math.min(1, (now - sceneStart) / DURATION);
    railEl.style.transform = `scaleX(${p})`;
    if(p >= 1){
      goTo(current + 1);
    }
  }
  requestAnimationFrame(animate);
}

document.addEventListener("keydown", (e)=>{
  if(e.code === "Space" || e.key === " "){
    e.preventDefault();
    if(!e.repeat) goTo(current + 1);
    return;
  }
  if(e.key === "ArrowRight"){
    e.preventDefault();
    goTo(current + 1);
  }
  if(e.key === "ArrowLeft"){
    e.preventDefault();
    goTo(current - 1);
  }
});

ticksEl.addEventListener("click", (e)=>{
  const btn = e.target.closest(".tick");
  if(!btn) return;
  goTo(Number(btn.dataset.i));
  btn.blur();
});

window.addEventListener("resize", ()=>{
  railEl.style.transform = "scaleX(0)";
});

goTo(startAt);
requestAnimationFrame(animate);
</script>
