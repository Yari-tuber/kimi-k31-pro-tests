.hou{writing-mode:vertical-rl;font-size:1.85vh;letter-spacing:.36em;line-height:1;margin-top:1.2vh}

.hou em{font-style:normal;font-size:1.15vh;opacity:.55;margin-bottom:1.4vh;letter-spacing:.2em}
@keyframes fadeIn{from{opacity:0;transform:translateY(-1.2vh)}to{opacity:.88;transform:none}}

.info{position:absolute;left:9vw;bottom:8vh}
.info>*{opacity:0;animation:up 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(1.6vh)}to{opacity:1;transform:none}}
.num{font-family:var(--latin);font-size:6.4vh;font-weight:300;line-height:1;letter-spacing:.04em}
.num small{font-size:1.5vh;opacity:.55;margin-left:.8vh;letter-spacing:.25em}
.py{font-family:var(--latin);font-style:italic;font-size:2.5vh;letter-spacing:.14em;margin-top:1.8vh}
.en{font-family:var(--latin);font-size:1.15vh;letter-spacing:.5em;text-transform:uppercase;opacity:.7;margin-top:.9vh}
.desc{font-size:2vh;letter-spacing:.55em;margin-top:2.4vh}
.date{font-size:1.25vh;letter-spacing:.45em;opacity:.6;margin-top:1.2vh}

.wheel{position:absolute;top:50%;right:-62vh;width:100vh;height:100vh;margin-top:-50vh}
.wrot{position:absolute;inset:0;transition:transform 1.5s cubic-bezier(.65,0,.25,1)}
.wrot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lab{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:1.55vh;letter-spacing:.32em;white-space:nowrap;opacity:.38;transition:opacity 1s,font-size 1s,letter-spacing 1s}
.lab.on{opacity:1;font-size:2.3vh;letter-spacing:.4em}
.sea{position:absolute;left:50%;top:50%;transform-origin:0 0;font-family:var(--kai);font-size:3.4vh;opacity:.2}
.pointer{position:absolute;left:-1.5vh;top:50%;width:4.5vh;height:1px;background:currentColor;opacity:.8}
.pointer::after{content:'';position:absolute;right:-.5vh;top:-.5vh;width:1vh;height:1vh;border-radius:50%;background:var(--seal)}

.hint{position:absolute;right:4vw;bottom:4.2vh;font-size:1.15vh;letter-spacing:.4em;opacity:.6;display:flex;align-items:center;gap:1vh}
.hint kbd{font-family:var(--latin);font-size:1.05vh;letter-spacing:.2em;border:1px solid currentColor;padding:.35vh 1vh;border-radius:.4vh}
.bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:currentColor;opacity:.45;transform-origin:0 50%;transform:scaleX(0)}

@media (max-aspect-ratio:1/1){
  .wheel{display:none}
  .name{font-size:11vh}
  .title{left:8vw;top:11vh}
  .info{left:8vw}
}

  c.strokeStyle='#26302a';c.lineWidth=1.6;c.beginPath();c.moveTo(f.x-6,H+2);c.quadraticCurveTo(f.x,(fy+H)/2,fx,fy);c.stroke();if(k<=0)continue;
  for(const [n,rr,col] of[[22,1,f.c],[16,.65,mix(f.c,'#fff6c8',.35)]]){c.fillStyle=col;for(let j=0;j<n;j++){const a=j/n*TAU+f.ph+rr;c.beginPath();
   c.ellipse(fx+Math.cos(a)*f.r*rr*.5*k,fy+Math.sin(a)*f.r*rr*.5*k,f.r*rr*.5*k,f.r*.09*k+.5,a,0,TAU);c.fill()}}
  c.fillStyle='#b5761c';c.beginPath();c.arc(fx,fy,f.r*.15*k,0,TAU);c.fill()}}};
FX.stars=(S,o)=>{const P=Array.from({length:o.n},()=>({x:rnd(0,W),y:Math.pow(Math.random(),1.5)*H*.62,r:rnd(.3,1.4),ph:rnd(0,TAU),f:rnd(.5,2.2),b:rnd(.4,1)}));let sh=null;
 return(c,t)=>{const dt=S.dt,fade=clamp(S.age/1.5);c.fillStyle='#ffffff';for(const p of P){c.globalAlpha=(.35+.65*(.5+.5*Math.sin(t*p.f+p.ph)))*p.b*fade;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill()}
  if(o.shoot){if(!sh&&Math.random()<dt*.4)sh={x:rnd(W*.35,W),y:rnd(0,H*.25),vx:-rnd(500,800),vy:rnd(180,300),life:1};
   if(sh){sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.life-=dt*1.3;const ex=sh.x-sh.vx*.18,ey=sh.y-sh.vy*.18,g=c.createLinearGradient(sh.x,sh.y,ex,ey);
    g.addColorStop(0,`rgba(255,255,255,${Math.max(0,sh.life)})`);g.addColorStop(1,'rgba(255,255,255,0)');c.globalAlpha=1;c.strokeStyle=g;c.lineWidth=1.5;c.beginPath();c.moveTo(sh.x,sh.y);c.lineTo(ex,ey);c.stroke();if(sh.life<=0)sh=null}}}};
FX.rays=(S,o)=>c=>{const p=S.op;if(!p)return;const L=Math.max(W,H)*1.1;c.translate(p.x,p.y);c.rotate(S.age*.03);const g=c.createRadialGradient(0,0,p.r,0,0,L);
 g.addColorStop(0,rgba(o.c,.16));g.addColorStop(1,rgba(o.c,0));c.fillStyle=g;for(let i=0;i<o.n;i++){c.rotate(TAU/o.n);const w=.035+.025*Math.sin(i*2.3);c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(-w)*L,Math.sin(-w)*L);c.lineTo(Math.cos(w)*L,Math.sin(w)*L);c.fill()}};
FX.rainbow=(S,o)=>c=>{const k=clamp(S.age/3)*o.a,cx=W*.62,cy=H*.98,R0=H*.66,lw=H*.011;c.lineWidth=lw;
 ['#e45a5a','#ef9a4c','#f2d86a','#7cc47c','#5aa0d8','#7a6cc8'].forEach((col,i)=>{c.strokeStyle=rgba(col,k*.2);c.beginPath();c.arc(cx,cy,R0-i*lw,Math.PI,TAU);c.stroke()})};
FX.lightning=(S,o)=>{let next=rnd(.6,1.4),tau=9,bolt=null;
 function mkBolt(){const P=[];let x=rnd(W*.35,W*.9),y=-5;P.push([x,y]);while(y<H*.62){y+=rnd(12,34);x+=rnd(-28,28);P.push([x,y])}
  const B=[P];for(let b=0;b<2;b++){const s=P[2+(Math.random()*(P.length-4)|0)];let[x2,y2]=s;const Q=[[x2,y2]];const dir=Math.random()<.5?-1:1;for(let j=0;j<6;j++){y2+=rnd(10,24);x2+=dir*rnd(4,22);Q.push([x2,y2])}B.push(Q)}return B}
 return c=>{const dt=S.dt;next-=dt;tau+=dt;if(next<=0){next=rnd(1.8,3.6);tau=0;bolt=mkBolt()}
  const I=tau<.07?1:tau<.15?.25:tau<.24?.85:Math.exp(-(tau-.24)*5);if(I<.01)return;
  c.fillStyle=`rgba(225,228,255,${I*.42})`;c.fillRect(0,0,W,H);if(bolt&&tau<.6){c.strokeStyle=`rgba(255,255,255,${I})`;c.shadowColor='#c9d4ff';c.shadowBlur=18;
   bolt.forEach((Q,qi)=>{c.lineWidth=qi?1:2.2;c.beginPath();Q.forEach(([x,y],j)=>j?c.lineTo(x,y):c.moveTo(x,y));c.stroke()});c.shadowBlur=0}}};
const BACK=new Set(['stars','rays','rainbow','lightning']);

/* ============================== 场景 ============================== */
function makeRidge(rng,sharp){const cs=[];let f=1+rng()*1.6,a=1,sum=0;for(let k=0;k<5;k++){cs.push({f:f*Math.PI,a,p:rng()*TAU});sum+=a;f*=1.9+rng()*.5;a*=.48}
 return u=>{let s=0;for(const c of cs){const v=Math.sin(c.f*u+c.p);s+=c.a*(sharp*(1-Math.abs(v))+(1-sharp)*(v*.5+.5))}return s/sum}}
class Scene{
 constructor(i){this.i=i;this.d=T[i];this.age=0;this.dt=0;this.build()}
 build(){const d=this.d,rng=mulberry(this.i*7919+13);this.hz=d.water?H*.74:H;
  const base=d.water?[.56,.64,.715]:[.57,.68,.8],amp=d.water?[.11,.08,.05]:[.12,.085,.06];
  this.layers=d.mt.map((col,k)=>({col,b:base[k],a:amp[k],v:[3,7,14][k],ridge:makeRidge(rng,d.sharp*(k==2?.6:1))}));
  const mk=([n,o])=>({n,f:FX[n](this,o)});const pre=(d.pre||[]).map(mk);
  this.preB=pre.filter(e=>BACK.has(e.n));this.preF=pre.filter(e=>!BACK.has(e.n));this.fx=(d.fx||[]).map(mk);
  this.shim=Array.from({length:44},()=>({y:Math.random(),x:Math.random()*W,w:rnd(20,120),v:rnd(4,14)}))}
 run(list,c){for(const e of list){c.save();e.f(c,this.age);c.restore()}}
 orb(c,p,o){const g=c.createRadialGradient(p.x,p.y,p.r*.5,p.x,p.y,p.r*7);g.addColorStop(0,rgba(o.g,.7));g.addColorStop(.25,rgba(o.g,.2));g.addColorStop(1,rgba(o.g,0));
  c.fillStyle=g;c.fillRect(p.x-p.r*7,p.y-p.r*7,p.r*14,p.r*14);c.fillStyle=o.c;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill();
  if(o.m){c.fillStyle='rgba(120,110,90,.08)';for(const[a,b,r]of[[-.3,-.2,.28],[.25,.1,.2],[-.05,.38,.16],[.36,-.34,.12]]){c.beginPath();c.arc(p.x+a*p.r,p.y+b*p.r,r*p.r,0,TAU);c.fill()}}}
 layer(c,L,t,bottom){c.fillStyle=L.col;c.beginPath();c.moveTo(-2,bottom);const off=t*L.v;for(let x=-2;x<=W+6;x+=5)c.lineTo(x,H*(L.b-L.a*L.ridge((x+off)/W)*1.4));c.lineTo(W+6,bottom);c.fill()}
 render(c,dt){const d=this.d;this.dt=dt;this.age+=dt;const t=this.age;this.c=c;
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,d.sky[0]);g.addColorStop(1,d.sky[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  this.op=d.orb?{x:d.orb.x*W,y:(d.orb.y-Math.min(t,15)*.002)*H,r:d.orb.r*H}:null;
  this.run(this.preB,c);if(d.orb)this.orb(c,this.op,d.orb);this.run(this.preF,c);
  const bottom=d.water?this.hz:H+2;
  this.layers.forEach((L,k)=>{this.layer(c,L,t,bottom);if(k<2){const y0=H*(L.b-L.a*.9),y1=H*(L.b+.05),m=c.createLinearGradient(0,y0,0,y1);
   m.addColorStop(0,rgba(d.sky[1],0));m.addColorStop(1,rgba(d.sky[1],.55));c.fillStyle=m;c.fillRect(0,y0,W,H-y0)}});
  if(d.water)this.water(c,t,dt);
  this.run(this.fx,c)}
 water(c,t,dt){const d=this.d,hz=this.hz,g=c.createLinearGradient(0,hz,0,H);g.addColorStop(0,mix(d.sky[1],d.mt[2],.3));g.addColorStop(1,mix(d.sky[0],d.mt[2],.65));c.fillStyle=g;c.fillRect(0,hz,W,H-hz);
  c.save();c.beginPath();c.rect(0,hz,W,H-hz);c.clip();c.translate(0,hz*2);c.scale(1,-1);c.globalAlpha=.3;if(d.orb)this.orb(c,this.op,d.orb);this.layers.forEach(L=>this.layer(c,L,t,hz));c.restore();
  c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=1;c.beginPath();for(const s of this.shim){s.x+=s.v*dt;if(s.x>W+s.w)s.x=-s.w;const y=hz+(H-hz)*s.y,w=s.w*(.3+s.y);c.moveTo(s.x,y);c.lineTo(s.x+w,y)}c.stroke();
  c.fillStyle='rgba(255,255,255,.22)';c.fillRect(0,hz,W,1);
  if(d.orb){const p=this.op;for(let j=0;j<16;j++){const y=hz+4+(j/16)*(H-hz)*.9,w=p.r*(1.5-j*.05)*(.5+.5*Math.sin(t*2+j*1.7));c.fillStyle=rgba(d.orb.c,.4*(1-j/16));c.fillRect(p.x-w/2,y,w,1.5)}}}
}

/* ============================== 界面 ============================== */
const $=id=>document.getElementById(id);
const ui=$('ui'),nameEl=$('name'),seal=$('seal'),hou=$('hou'),info=$('info'),wrot=$('wrot'),bar=$('bar'),rule=$('rule');
(function grain(){const s=220,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),im=g.createImageData(s,s);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);$('grain').style.backgroundImage=`url(${c.toDataURL()})`})();
(function wheel(){const P=(r,a)=>{const th=(180+a)*Math.PI/180;return[50+r*Math.cos(th),50+r*Math.sin(th)]};let s='<svg viewBox="0 0 100 100"><g fill="none" stroke="currentColor">';
 s+='<circle cx="50" cy="50" r="47" stroke-width=".08" opacity=".7"/><circle cx="50" cy="50" r="30.5" stroke-width=".06" opacity=".5"/>';
 for(let k=0;k<72;k++){const a=k*5,maj=k%3==0,[x1,y1]=P(maj?45.6:46.3,a),[x2,y2]=P(47,a);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${maj?.12:.06}" opacity="${maj?.9:.5}"/>`}
 for(let q=0;q<4;q++){const[x1,y1]=P(29,q*90+3),[x2,y2]=P(29,q*90+87);s+=`<path d="M${x1} ${y1} A29 29 0 0 1 ${x2} ${y2}" stroke-width=".3" opacity=".35"/>`}
 s+='</g></svg>';T.forEach((d,i)=>s+=`<div class="lab" data-i="${i}" style="transform:rotate(${i*15}deg) translate(-44vh,-50%)">${d.n}</div>`);
 for(let q=0;q<4;q++)s+=`<div class="sea" style="transform:rotate(${(q*6+2.5)*15}deg) translate(-26vh,-50%)">${SEASON[q]}</div>`;wrot.innerHTML=s})();
const labs=[...document.querySelectorAll('.lab')];
let rot=0;
function updateUI(i,dir){const d=T[i];ui.style.color=d.ink;const dark=hex2rgb(d.ink).reduce((a,b)=>a+b)>384;ui.style.setProperty('--halo',rgba(dark?d.mt[2]:d.sky[1],.85));
 nameEl.innerHTML=[...d.n].map((ch,k)=>`<span style="animation-delay:${.2+k*.22}s">${ch}</span>`).join('');
 seal.textContent=SEASON[d.s];seal.classList.remove('on');rule.style.animation='none';void seal.offsetWidth;seal.classList.add('on');rule.style.animation='';
 hou.innerHTML=d.hou.map((h,k)=>`<p style="animation-delay:${.75+k*.16}s"><em>${['初候','二候','三候'][k]}</em>${h}</p>`).join('');
 const n=String(i+1).padStart(2,'0');
 info.innerHTML=[`<div class="num">${n}<small>/ 24</small></div>`,`<div class="py">${d.py}</div>`,`<div class="en">${d.en}</div>`,`<div class="desc">${d.desc}</div>`,
  `<div class="date">公历 ${cnNum(d.md[0])}月${cnNum(d.md[1])}日前后　·　${SEASON[d.s]}之${['孟','孟','仲','仲','季','季'][i%6]}</div>`]
  .map((h,k)=>h.replace('">',`" style="animation-delay:${.5+k*.12}s">`)).join('');
 labs.forEach((l,k)=>l.classList.toggle('on',k==i));
 if(dir==null){rot=-i*15;wrot.style.transition='none';wrot.style.transform=`rotate(${rot}deg)`;void wrot.offsetWidth;wrot.style.transition=''}
 else{const dl=((-i*15-rot)%360+540)%360-180;rot+=dl;wrot.style.transform=`rotate(${rot}deg)`}}

/* ============================== 主循环 ============================== */
const cvs=[...document.querySelectorAll('canvas.layer')],ctxs=cvs.map(c=>c.getContext('2d'));
const slots=[{scene:null},{scene:null}];let front=0,idx=0,elapsed=0,fadeT=0,last=performance.now();
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.forEach((c,k)=>{c.width=W*DPR;c.height=H*DPR;ctxs[k].setTransform(DPR,0,0,DPR,0,0)});slots.forEach(s=>s.scene&&s.scene.build())}
function show(i,dir){idx=(i+24)%24;const nf=1-front,old=cvs[front],nw=cvs[nf];
 old.style.transition='none';if(slots[front].scene)old.style.opacity=1;old.style.zIndex=1;
 nw.style.transition='none';nw.style.opacity=0;nw.style.zIndex=2;slots[nf].scene=new Scene(idx);
 void nw.offsetWidth;nw.style.transition='opacity 1.4s ease';nw.style.opacity=1;front=nf;fadeT=1.5;elapsed=0;updateUI(idx,dir)}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;if(elapsed>=DUR)show(idx+1,1);
 slots.forEach((s,k)=>{if(s.scene)s.scene.render(ctxs[k],dt)});
 if(fadeT>0){fadeT-=dt;if(fadeT<=0)slots[1-front].scene=null}
 bar.style.transform=`scaleX(${Math.min(1,elapsed/DUR)})`;requestAnimationFrame(loop)}
function todayIdx(){const now=new Date(),y=now.getFullYear();let best=-1,bt=-Infinity;T.forEach((x,i)=>{const t=new Date(y,x.md[0]-1,x.md[1]).getTime();if(t<=now&&t>bt){bt=t;best=i}});return best<0?21:best}
addEventListener('resize',resize);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();show(idx+1,1)}else if(e.code==='ArrowLeft'){e.preventDefault();show(idx-1,-1)}});
addEventListener('click',()=>show(idx+1,1));
resize();show(todayIdx());requestAnimationFrame(loop);
</script>
